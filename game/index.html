<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>TVA FIELD UNIT</title>
<!-- ============================================================================
     TVA FIELD UNIT — 게임 모드  (v2)

     게임보이·컬러 에뮬레이터는 binjgb (MIT, Copyright 2017 Ben Smith)
     https://github.com/binji/binjgb

     [ 파일 구실 ]
       game.js  에뮬레이터 + 롬 보관 + 비정상 종료 방어
       ui.js    화면 흐름 (시스템 고르기 → 목록 → 플레이 → 메뉴)
       pad.js   터치 십자키 + 블루투스 게임패드
       mgba.js  GBA 코어 (있을 때만. 없으면 GBA 만 못 씁니다)
       이 파일  화면 그리기와 크기 맞추기

     ★★ v2 에서 달라진 것 ★★
       1. 시스템 셋 — GAME BOY / GAME BOY COLOR / GAME BOY ADVANCE
          (게임&워치는 없앴습니다. 만들 것이 하나도 없었습니다.)
       2. 메뉴는 전부 손가락으로. SELECT·START 는 이제 **게임 전용**입니다.
       3. 화면 색 토글 — 템패드 주황 ↔ 게임 본래 색
       4. 배치는 모드가 아니라 공식 하나로. 게임 화면은 늘 최대,
          조작판은 비율 때문에 남는 좌우 여백에 삽니다.
       5. 조작판 숨김 토글 — 게임패드로 할 때 화면을 더 키웁니다.

     ★ 이 파일에서 절대 되돌리면 안 되는 것 — onTap() 을 쓰는 이유
       v1 은 버튼을 `click` 으로 받았습니다. 그런데 pointerdown 에서
       preventDefault 를 부르면 **아이폰 사파리가 click 을 안 보내는 경우가
       있습니다.** 그러면 게임 중 유일한 탈출구인 MENU 가 죽습니다.
       v2 는 click 을 아예 안 씁니다. pointerup 으로 직접 처리합니다.

     로직은 전부 브라우저 없이 검사됩니다 →  node test/all.js
     ========================================================================= -->
<style>
:root{
  --or:#F8861E; --dim:#78420F; --mid:#A85C18; --bg:#040506;
  /* ★ 읽는 글자만 이 값을 따릅니다.
       버튼과 십자키는 손가락 크기라 고정입니다 — 글자를 키운다고
       버튼이 같이 커지면 화면 밖으로 나갑니다.
       템패드 본체와 같은 이름표(tempad.fs)를 써서 설정이 이어집니다. */
  --fs: 13px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{
  width:100%; height:100%; background:var(--bg); overflow:hidden;
  font-family:ui-monospace,"Courier New",monospace; color:var(--or);
  /* 브라우저가 스크롤·확대·길게눌러선택으로 터치를 가로채는 걸 막습니다 */
  touch-action:none; user-select:none; -webkit-user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
#dev{ position:absolute; border:2px solid var(--or); border-radius:10px; overflow:hidden; }

/* ── 가운데 (게임 화면 = 내용이 사는 곳) ─────────────────────────────── */
/* ★ 게임화면 테두리는 **좌우 선만** 씁니다.
     위아래 선을 두면 바깥 테두리와의 여백이 위아래로 생기는데, 그게
     한쪽으로 쏠려 보였습니다. 선을 없애고 좌우선을 바깥 테두리까지
     쭉 이으면 여백 자체가 없어져 쏠릴 것이 없습니다. */
#stage{ position:absolute; border-left:2px solid var(--or);
        border-right:2px solid var(--or); }
/* ★ 테두리가 세로로 꽉 차게 되었으므로, 화면은 그 안에서 자리를 잡아
     띄웁니다(fit 이 top 을 정합니다). 안 그러면 위에 딱 붙습니다. */
#screen,#screenGba{ position:absolute; left:0; display:block;
         image-rendering:pixelated; image-rendering:crisp-edges;
         background:var(--bg); }
/* GBA 는 mGBA 가 제 캔버스에 직접 그립니다. 픽셀을 우리가 못 만지므로
   주황은 CSS 필터로 만듭니다 — GPU 가 하니 매 프레임 비용이 0 입니다.
   ★ 게임보이처럼 4단계로 뭉개면 안 됩니다. GBA 는 색이 수천 가지라
     글자가 안 보이게 됩니다. 앰버 모니터처럼 **연속된 주황**이 맞습니다. */
#screenGba.amber{ filter: grayscale(1) sepia(1) saturate(4) hue-rotate(-12deg) contrast(1.15); }
/* 게임이 안 돌 때 이 위에 목록·메뉴를 그립니다.
   ★ body 는 touch-action:none 이라 손가락 스크롤이 막혀 있습니다.
     여기만 위아래 쓸기를 허락합니다 (좌우는 여전히 막습니다). */
#page{ position:absolute; overflow-y:auto; overflow-x:hidden; padding:6px 8px;
       scrollbar-width:none; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
#page::-webkit-scrollbar{ display:none; }
#page h2{ font-size:calc(var(--fs) * .85); letter-spacing:2px; color:var(--or);
          border-bottom:1px solid var(--dim); padding-bottom:3px; margin-bottom:5px; }

/* ★★ v2 — 줄은 전부 **손가락으로 누르는 것**입니다. ★★
     그래서 최소 높이를 못 박습니다. 글자 크기를 아무리 줄여도
     누를 수 있는 높이는 38px 밑으로 안 내려갑니다.
     (손가락 권장 최소치가 44px 인데, 작은 화면이라 38 로 타협했습니다.) */
.row{ font-size:calc(var(--fs) * .85); letter-spacing:.5px; color:var(--mid);
      padding:4px 6px; min-height:38px; display:flex; flex-direction:column;
      justify-content:center; border-bottom:1px solid rgba(120,66,15,.35); }
.row .t{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row.sel{ background:var(--or); color:var(--bg); }
.row .sub{ font-size:calc(var(--fs) * .68); color:var(--dim);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row.sel .sub{ color:var(--bg); opacity:.8; }
.row.press{ background:rgba(248,134,30,.28); }
/* 한 줄짜리 (메뉴·시스템) — 이름과 설명이 같은 줄 양끝에 */
.row.one{ flex-direction:row; align-items:center; gap:8px; }
.row.one .t{ flex:0 1 auto; }
.row.one .sub{ margin-left:auto; }

/* ★ 넣기 버튼. 목록 맨 위에 둡니다 — 게임이 하나도 없을 때
     제일 먼저 보여야 하는 것이기 때문입니다. 점선으로 게임과 구분합니다. */
.row.add{ border:1px dashed var(--dim); border-radius:6px; color:var(--or);
          margin-bottom:6px; align-items:center; flex-direction:row; }

/* 길게 누르는 동안 차오르는 막대 — "누르고 있으면 뭔가 된다"를 보여줍니다.
   ★ 막대는 실제 시간(0.9초)보다 조금 빨리 찹니다. 꽉 찬 뒤에도 잠깐
     여유가 있어야 "어, 이거 지워지겠다" 하고 뗄 수 있습니다. */
.row .hold{ height:2px; background:var(--or); width:0; margin-top:3px;
            transition:width .65s linear; }
.row.holding .hold{ width:100%; }
.row.sel .hold{ background:var(--bg); }   /* 고른 줄은 바탕이 주황이라 */

#page .empty{ font-size:calc(var(--fs) * .78); color:var(--dim); line-height:1.7; margin-top:6px; }

/* ── 지울까 물어보는 화면 ──────────────────────────────────────────────
   ★ v2 — 화면에 보이는 버튼 두 개로 답합니다.
     v1 은 "START 를 눌러 지움" 이었는데, 그건 규칙을 하나 더 외우게
     하는 것입니다. 눈에 보이는 버튼은 외울 것이 없습니다. */
#page .ask{ font-size:calc(var(--fs) * .78); color:var(--or); line-height:1.55; }
#page .ask b{ display:block; color:var(--bg); background:var(--or);
              padding:2px 4px; margin:4px 0; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
#page .ask .warn{ color:var(--dim); }
.ask2{ display:flex; gap:8px; margin-top:10px; }
.ask2 .b{ flex:1; min-height:42px; display:flex; align-items:center; justify-content:center;
          border:2px solid var(--dim); border-radius:8px; color:var(--dim);
          font-size:calc(var(--fs) * .8); letter-spacing:1px; }
/* 안전한 쪽을 밝게, 위험한 쪽을 흐리게. 눈이 먼저 KEEP 으로 갑니다. */
.ask2 .b.keep{ border-color:var(--or); color:var(--or); }
.ask2 .b.del.press{ background:var(--or); color:var(--bg); }
.ask2 .b.keep.press{ background:var(--or); color:var(--bg); }
/* 창이 막 떴을 때는 아무것도 못 누릅니다 (아래 ARM_MS) */
.ask2.cold{ opacity:.45; }

/* 메뉴 줄 안의 작은 버튼 (LOAD / SAVE) */
.mini{ min-width:46px; min-height:30px; display:flex; align-items:center; justify-content:center;
       border:1px solid var(--dim); border-radius:5px; color:var(--or);
       font-size:calc(var(--fs) * .62); letter-spacing:1px; margin-left:6px; }
.row.sel .mini{ border-color:var(--bg); color:var(--bg); }
.mini.press{ background:var(--or); color:var(--bg); }

/* ── 좌우 판 ───────────────────────────────────────────────────────── */
.pane{ position:absolute; top:0; bottom:0; }
/* ★ 십자키 그림은 안내일 뿐. 왼쪽 판 전체가 조작 영역입니다. */
#padArea{ position:absolute; inset:0; touch-action:none; }
#padHint{ position:absolute; opacity:.5; pointer-events:none; }
#padHint path{ fill:none; stroke:var(--dim); stroke-width:3; }
.lbl{ position:absolute; font-size:9px; letter-spacing:1.5px; color:var(--dim);
      pointer-events:none; }

#info{ position:absolute; overflow:hidden; font-size:calc(var(--fs) * .78);
       line-height:1.55; letter-spacing:.6px; pointer-events:none; }
#info .h{ color:var(--or); font-size:calc(var(--fs) * .78); letter-spacing:2px; }
#info .v{ color:var(--dim); }
#info hr{ border:0; border-top:1px solid var(--dim); margin:2px 0 5px; }

/* ── 게임 버튼은 전부 고정 크기 (손가락 크기라 글자와 무관) ──────────
   NES 패드 배치를 따릅니다:
     십자키 왼쪽 · SELECT/START 작은 알약 두 개 · B A 동그라미 (B 가 왼쪽) */
/* ★ 글자 크기는 **버튼 크기에 맞춥니다.** 15px 은 지름 58px 버튼에서
     너무 작아 안 보였습니다. 여기 글자들은 --fs(읽는 글자 크기)를 따르지
     않습니다 — 버튼은 손가락 크기로 고정이라 글자도 같이 고정입니다. */
.btn{ position:absolute; border:3px solid var(--dim); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:24px; font-weight:700; color:var(--dim); }
/* ★★ 보이는 것보다 **누를 수 있는 면이 더 넓습니다.** ★★
     테두리 바깥으로 10px 씩 더 잡습니다. 게임 중에 화면을 안 보고
     엄지로 더듬어 누르기 때문에, 빗나가도 눌리는 게 맞습니다. */
.btn::before, .cap::before{ content:""; position:absolute; inset:-10px; }
.btn.on{ border-color:var(--or); color:var(--or); background:rgba(248,134,30,.18); }
/* ★ GBA 의 L·R — A·B 위에 답니다. 모서리를 둥근 네모로 해서
     동그란 A·B 와 손끝 느낌이 다르게 했습니다 (안 보고 눌러도 구분되게). */
.btn.sh{ border-radius:9px; font-size:18px; font-weight:700; }
/* SELECT / START — 눕힌 알약 */
.cap{ position:absolute; border:2px solid var(--dim); border-radius:99px;
      display:flex; align-items:center; justify-content:center;
      font-size:8px; letter-spacing:.5px; color:var(--dim); }
.cap.on{ border-color:var(--or); color:var(--or); background:rgba(248,134,30,.18); }
/* SELECT / START 이름표 — 7px 은 사실상 안 보였습니다 */
.caplbl{ position:absolute; font-size:11px; letter-spacing:.5px; color:var(--dim);
         text-align:center; pointer-events:none; }
/* 글자 크기 조절 (왼쪽 판 위) */
.fsbtn{ position:absolute; border:2px solid var(--dim); border-radius:6px;
        display:flex; align-items:center; justify-content:center;
        font-size:15px; font-weight:700; color:var(--dim); }
.fsbtn.on{ border-color:var(--or); color:var(--or); }

/* ── ★★ 구석 존 — 메뉴와 토글. 게임 조작과 완전히 분리된 구역 ★★ ──────
   사용자 요구: "메뉴 버튼과 메뉴에서 필요한 버튼은 우측 상단에 표시하여
   독립적으로 동작하게." 게임 버튼 근처에 두지 않는 것이 핵심입니다.
   여기 있는 것들은 **게임에 아무 입력도 보내지 않습니다.** */
/* ★ 세로로 쌓습니다. 가로로 늘어놓으면 좁은 기기에서 자리가 모자라
     **게임 화면 위로 넘어옵니다.** (배치를 그림으로 뽑아 보고 알았습니다 —
     아이폰SE 나 GBA 에서 20px 쯤 게임을 덮고 있었습니다.)
     세로로 쌓으면 오른쪽 판 폭이 얼마든 상관없이 제자리에 앉습니다.
     자리는 fit() 이 정합니다. */
#zone{ position:absolute; display:flex; flex-direction:column; gap:5px; z-index:5; }
/* ★ position:relative 가 반드시 있어야 합니다.
     아래 ::before(넓힌 과녁)는 position:absolute 인데, 기준이 될 조상이
     없으면 #zone(position:absolute) 을 기준으로 잡습니다. 그러면 세 버튼의
     과녁이 전부 존 전체 크기가 되어 **서로 겹치고 엉뚱한 버튼이 눌립니다.** */
.zb{ position:relative;
     width:100%; height:var(--zh,28px); padding:0 4px;
     display:flex; align-items:center; justify-content:center;
     border:2px solid var(--or); border-radius:7px;
     color:var(--or); font-size:10px; letter-spacing:1px; background:var(--bg);
     white-space:nowrap; overflow:hidden; }
/* 보이는 것보다 누를 수 있는 면을 좌우로 조금 더 넓게.
   ★ 위아래로는 2px 만 넓힙니다 — 5px 간격이라 더 넓히면 이웃과 겹칩니다. */
.zb::before{ content:""; position:absolute; inset:-2px -6px; }
.zb.press{ background:var(--or); color:var(--bg); }
/* 꺼져 있는 토글은 흐리게 — 지금 어떤 상태인지 한눈에 */
.zb.off{ border-color:var(--dim); color:var(--dim); }

#bar{ position:absolute; left:8px; right:8px; bottom:3px; display:flex;
      justify-content:space-between; font-size:9px; letter-spacing:1px;
      color:var(--dim); pointer-events:none; }
/* ★ 이 글자는 이름표입니다. 아무 일도 안 합니다.
     v1 에서는 여기가 "나가기" 였는데 십자키 바로 옆이라 게임 중에
     엄지가 스치면 그대로 밖으로 튕겨나갔습니다. */
#back{ padding:2px 7px; margin:-2px -1px; color:var(--mid); }
/* 오른쪽 잘림 조절은 여기를 길게 눌러서 합니다 (게임 버튼을 안 씁니다) */
#diag{ pointer-events:auto; padding:2px 6px; margin:-2px -1px; }
#note{ position:absolute; left:8px; right:8px; bottom:15px; font-size:calc(var(--fs) * .7);
       letter-spacing:1px; color:var(--or); text-align:center; pointer-events:none; }

#rot{ position:fixed; inset:0; display:none; background:var(--bg);
      align-items:center; justify-content:center; font-size:14px; letter-spacing:2px; z-index:99; }
@media (orientation:portrait){ #rot{ display:flex; } #dev{ visibility:hidden; } }
/* ★ display:none 으로 숨기면 안 됩니다.
     사파리는 화면에 없는 <input type=file> 의 프로그램적 click() 을
     무시한 전례가 있습니다. 그러면 "+ ADD GAME" 이 아무 반응 없는 버튼이
     됩니다 — 게임을 넣는 유일한 길이 막힙니다.
     보이지만 않게 화면 밖으로 밀어둡니다. 이게 널리 쓰는 안전한 방법입니다. */
/* ★★ 파일 입력칸을 **하나도 빠뜨리지 말 것.** ★★
     zip 칸을 새로 만들면서 이 목록에 안 넣어서, 화면 왼쪽 위에
     "파일 선택" 회색 버튼이 그대로 튀어나왔습니다(B0811j 로 배포까지 됐습니다).
     새 입력칸을 만들면 반드시 여기에도 더하세요 — 검사가 지킵니다. */
#file,#dir,#zip{ position:fixed; left:-9999px; top:0; width:1px; height:1px;
            opacity:0; pointer-events:none; }
/* 조작판을 껐을 때 — 게임 버튼만 숨깁니다. 구석 존은 그대로 남습니다.
   ★ 이게 핵심입니다. 다 숨겨버리면 패드가 없는 사람이 갇힙니다. */
.hidepad #padArea, .hidepad #padHint, .hidepad #lblMove,
.hidepad .btn, .hidepad .cap, .hidepad .caplbl, .hidepad .fsbtn{ display:none; }
</style>
</head>
<body>

<div id="dev">
  <div class="pane" id="paneL">
    <div id="padArea"></div>
    <svg id="padHint" viewBox="0 0 100 100">
      <path d="M35 12 H65 V35 H88 V65 H65 V88 H35 V65 H12 V35 H35 Z"/>
    </svg>
    <div class="lbl" id="lblMove">MOVE</div>
    <!-- 읽는 글자만 키웁니다. 버튼·십자키는 그대로입니다. -->
    <div class="fsbtn" id="fsUp">A+</div>
    <div class="fsbtn" id="fsDn">A-</div>
  </div>

  <div id="stage">
    <canvas id="screen" width="160" height="144"></canvas>
    <!-- ★ GBA 전용 캔버스. 한 캔버스에는 2D 든 WebGL 이든 **한 종류만**

<!-- 파일 하나 또는 여러 개 -->

<!-- ★ 폴더째. webkitdirectory 는 표준은 아니지만 안드로이드·PC 에서 됩니다.

<!-- ★ zip 전용. 어느 폰에서든 **파일 고르기**가 열립니다.

     안 주고 MIME 만 줍니다. 다만 진짜 판정은 이름이 아니라 앞 4바이트로 합니다. -->
<!-- ★ application/octet-stream 을 꼭 넣어둡니다.
     안드로이드의 내려받기 폴더는 zip 을 그 형식으로 내주는 경우가 있고,
     그러면 고르기 화면에서 zip 이 **회색으로 눌리지도 않습니다.**
     기능이 있는데 손이 안 닿는 것이 제일 나쁩니다.

<input type="file" id="zip" accept=".zip,application/zip,application/x-zip-compressed,application/octet-stream" multiple>

<!-- ★ 에뮬레이터를 먼저 불러야 합니다. 아래에 두면 boot() 이 먼저 돌아서 못 찾습니다.
     파일이 없어도 페이지는 떠야 하므로 onerror 로 넘어갑니다.
     mgba.js 는 없을 수도 있습니다 — 그러면 GBA 만 못 씁니다. -->
<script src="binjgb.js" onerror="window.__noBinjgb=1"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script src="pad.js"></script>
<!-- ★ zip 읽기. 없어도 나머지는 그대로 돌아야 하므로 onerror 로 넘어갑니다
     (옛 서비스워커가 살아있는 폰에서는 이 파일만 404 일 수 있습니다). -->
<script src="unzip.js" onerror="window.__noZip=1"></script>
<!-- ★ GBA 코어(mgba.js)는 여기서 안 부릅니다.
     여기 두면 파일이 없을 때 **켤 때마다 404 를 한 번 기다립니다.**
     게임보이만 하는 사람에게는 순전한 손해라, GBA 를 고른 순간에만
     불러옵니다 (아래 loadMgba). -->
<script>
/* ── 새 상태값은 맨 위에 ───────────────────────────────────────────── */
let edgeRight = 0;      /* 폰마다 오른쪽이 잘려서 따로 조절 */
let wasmMod   = null;   /* binjgb. 처음 필요할 때 부릅니다 */
let mgbaMod   = null;   /* mGBA. 마찬가지 */
let ui        = null;
let pad       = null;
/* ★★ 화면 깜빡임 방지 ★★
   폰에서 visualViewport 의 scroll 은 쉴 새 없이 옵니다.
   그때마다 화면 전체를 다시 재면 번쩍번쩍 깜빡입니다.
     1. 한 프레임에 한 번만
     2. 크기가 그대로면 아무것도 안 함
     3. 노치 여백은 한 번만 재서 기억 */
let fitPending  = false;
let lastFitKey  = "";
let insCache    = null;

/* 시스템마다 화면 크기가 다릅니다 */
const SCREENS = { gb:[160,144], gbc:[160,144], gba:[240,160] };
const MARGIN = 12;
/* ★ 조작판이 살 최소 폭. 십자키(약 110) + 좌우 여유.
     이보다 좁아지면 게임 화면을 줄여서라도 조작판 자리를 지킵니다. */
const MIN_SIDE_PAD = 150;
/* ★ 조작판을 껐을 때도 구석 존(MENU/CLR/PAD)은 남아야 합니다 — 안 그러면
     패드가 없는 사람이 갇힙니다. 그래서 0 이 아니라 존이 앉을 만큼은 남깁니다.
     150 → 76 이라 화면은 여전히 양쪽으로 74px 씩, 도합 148px 넓어집니다. */
const MIN_SIDE_BARE = 76;

const $ = id => document.getElementById(id);

/* ★ 요소를 그 자리에 놓습니다.
     v1 은 `el.style.cssText += ";left:...;top:..."` 였습니다. CSS 는 나중 것이
     이기니 화면은 맞게 나오지만, **문자열이 fit() 을 부를 때마다 계속 길어집니다.**
     화면을 돌리거나 글자 크기를 바꿀 때마다 조금씩 쌓입니다.
     게다가 값을 읽어서 확인하려 하면 옛 값이 먼저 잡혀서 배치를 검증할 수가
     없습니다 (실제로 이것 때문에 멀쩡한 배치를 겹쳤다고 오해했습니다).
     속성을 직접 넣으면 언제나 하나의 값만 남습니다.                       */
function place(el, x, y, w, h){
  if (!el) return;
  const s = el.style;
  s.left = Math.round(x) + "px";
  s.top  = Math.round(y) + "px";
  if (w !== undefined) s.width  = Math.round(w) + "px";
  if (h !== undefined) s.height = Math.round(h) + "px";
}

/* ★★ 화면에 글자를 넣기 전에 반드시 이걸 거칩니다. ★★
     게임 이름은 롬 안에서 읽거나 **파일 이름에서 가져옵니다.**
     파일 이름은 아드님이 마음대로 지을 수 있습니다.
     `<img onerror=...>.gb` 같은 이름이면 그게 그대로 실행됩니다.
     장난감이라도 이건 막아둡니다. */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ★ 지우기 확인창이 뜬 시각. 뜬 직후 잠깐은 버튼을 안 받습니다.
     길게 누르던 손가락을 떼면서 다른 버튼이 같이 눌리는 사고를 막습니다. */
let armAt = 0;
const ARM_MS = 400;
/* boot() 안에서 만드는 "길게 누르기 취소" 함수를 여기에 걸어둡니다.
   draw() 가 화면을 새로 그릴 때 같이 꺼야 하기 때문입니다. */
let holdCancel = null;
/* boot() 안에서 만드는 "정리하고 템패드로 나가기". EXIT 가 씁니다. */
let doLeave = null;

/* ── 블루투스 게임패드 상태 ───────────────────────────────────────────
   ★ 일부러 여기(맨 바깥)에 둡니다. boot() 안에 두면 검사에서 들여다볼 수가
     없어서, "돌고 있는지" 를 확인할 방법이 사라집니다. */
let gpPrev = [];      /* 지난 프레임에 눌려 있던 것들 (조합을 걷어낸 뒤) */
let gpMenu = false;   /* 지난 프레임에 MENU 조합이 눌려 있었는가 */
let gpRaf  = 0;       /* 프레임 예약 번호. 0 이면 안 돌고 있음 */
let gpSeen = false;   /* 첫 입력을 봤는가 (소리 깨우기용) */

/* ★ 폴더째 고르기가 되는 기기인지.
     아이폰·아이패드 사파리는 webkitdirectory 속성은 있는데 실제로는
     폴더를 못 고릅니다. 그래서 속성 검사만으로는 안 되고 기기를 봅니다.
     (아이패드는 최근 것부터 "Macintosh" 라고 말해서 손가락 수까지 봅니다.) */
const CAN_DIR = (() => {
  try {
    if (!("webkitdirectory" in document.createElement("input"))) return false;
    const ua = navigator.userAgent || "";
    const iOS = /iPad|iPhone|iPod/.test(ua) ||
                (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
    return !iOS;
  } catch (e) { return false; }
})();

/* ══ ★★ 누르기 — 이 프로젝트에서 제일 조심해야 하는 부분 ★★ ══════════

   v1 은 화면 버튼을 `click` 으로 받았습니다. 그런데 pointerdown 에서
   preventDefault 를 부르면 **아이폰 사파리가 click 을 안 보내는 일이
   있습니다.** 그러면 게임 중 유일한 탈출구인 MENU 가 죽습니다.
   (인계서 12장 B-2 — "제일 위험한 미확인 항목" 으로 적혀 있던 것입니다.)

   그래서 v2 는 click 을 아예 안 씁니다. pointerup 으로 직접 처리합니다.
     · pointerdown 에서 "이 버튼에서 시작했다" 고 표시
     · pointerup 이 같은 버튼에서 오면 실행
     · 손가락이 밖으로 나가거나(pointerleave) 전화가 오면(pointercancel) 취소
   이러면 어느 브라우저에서든 확실히 동작합니다.                          */
function onTap(el, fn){
  if (!el) return;
  let armed = false, sx = 0, sy = 0;
  const off = () => { armed = false; el.classList.remove("press"); };
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    armed = true; sx = e.clientX || 0; sy = e.clientY || 0;
    el.classList.add("press");
  }, { passive:false });
  /* ★ 손가락이 버튼 밖으로 끌려나갔으면 취소합니다.
       ★★ pointerleave 만으로는 안 됩니다. 터치는 pointerdown 이 일어난
         요소에 **자동으로 붙잡혀서**(implicit pointer capture) 손가락이
         밖으로 나가도 pointerleave 가 안 오고, pointerup 도 원래 버튼으로
         돌아옵니다. 그래서 "눌렀다가 마음이 바뀌어 끌고 나가서 뗐는데도
         그대로 실행되는" 일이 벌어졌습니다.
         움직인 거리로 직접 판정합니다. 목록 쪽(#page)과 같은 방식입니다.
         (2026-08-11 교차검사에서 잡았습니다.)                            */
  el.addEventListener("pointermove", e => {
    if (!armed) return;
    if (Math.abs((e.clientX||0) - sx) > 16 || Math.abs((e.clientY||0) - sy) > 16) off();
  }, { passive:true });
  el.addEventListener("pointerup", e => {
    e.preventDefault();
    el.classList.remove("press");
    if (!armed) return;
    armed = false;
    fn(e);
  }, { passive:false });
  el.addEventListener("pointercancel", off);
  el.addEventListener("pointerleave", off);
  el.addEventListener("lostpointercapture", off);
}

/* ══ 크기 맞추기 ══════════════════════════════════════════════════════
   ★ vh/vw 를 믿지 마세요. 폰마다 주소창을 포함해서 알려줍니다.
     visualViewport 가 실제로 보이는 크기입니다.                        */
function insets(){
  if (insCache) return insCache;          /* ★ 한 번만 잽니다 */
  const p = document.createElement("div");
  p.style.cssText = "position:fixed;visibility:hidden;"
    + "top:env(safe-area-inset-top);left:env(safe-area-inset-left);"
    + "bottom:env(safe-area-inset-bottom);right:env(safe-area-inset-right)";
  document.body.appendChild(p);
  const s = getComputedStyle(p), n = v => Math.max(0, parseFloat(v) || 0);
  const r = { t:n(s.top), l:n(s.left), b:n(s.bottom), r:n(s.right) };
  p.remove();
  insCache = r;
  return r;
}

function scheduleFit(){
  if (fitPending) return;
  fitPending = true;
  requestAnimationFrame(() => { fitPending = false; fit(); });
}

/* ★★ v2 의 배치 — 모드가 아니라 공식 하나입니다. ★★

   v1 은 정수배 확대만 했습니다 (도트가 안 뭉개지니까). 그런데 그러면
   폰 화면이 아무리 커도 게임은 계단식으로만 커져서 여백이 잔뜩 남았습니다.

   v2 는 이렇게 정합니다.
       게임 폭 = min( 화면높이 × 화면비율,  화면폭 − 2 × 조작판최소폭 )
   · 세로를 먼저 다 씁니다 (가로 화면이라 세로가 늘 부족합니다).
   · 그래서 가로가 모자라면, 조작판 자리를 지킬 만큼만 줄입니다.
   · 늘리기도 자르기도 안 합니다. 비율은 언제나 그대로입니다.

   결과적으로 넓은 폰에서는 게임이 꽉 차고 좌우에 조작판이 넉넉히 앉고,
   좁은 폰(16:9) + GBA 처럼 빠듯한 조합에서만 게임이 조금 줄어듭니다.
   "전체화면 모드" 라는 것이 따로 필요 없어집니다.                     */
function fit(){
  const vv = window.visualViewport, de = document.documentElement;
  const small = (a,b,c) => Math.floor(Math.min(a||Infinity, b||Infinity, c||Infinity));
  const W = small(vv && vv.width,  de && de.clientWidth,  window.innerWidth);
  const H = small(vv && vv.height, de && de.clientHeight, window.innerHeight);
  if(!isFinite(W) || !isFinite(H) || !W || !H) return;

  const st8 = ui ? ui.state : { systemId:"gb", padVisible:true };
  const showPad = st8.padVisible !== false;
  const [SW, SH] = SCREENS[st8.systemId] || SCREENS.gb;

  const ins = insets();
  /* ★ 지난번과 똑같으면 아무것도 안 합니다. 이게 깜빡임을 없앱니다. */
  const key = `${W}x${H}|${ins.t},${ins.r},${ins.b},${ins.l}|${edgeRight}|${fsNow}|${SW}|${showPad?1:0}`;
  if (key === lastFitKey) return;
  lastFitKey = key;

  const dw = W - ins.l - ins.r - MARGIN*2 - edgeRight;
  const dh = H - ins.t - ins.b - MARGIN*2;
  const dev = $("dev");
  dev.style.left = (ins.l+MARGIN)+"px"; dev.style.top = (ins.t+MARGIN)+"px";
  dev.style.width = dw+"px"; dev.style.height = dh+"px";
  dev.classList.toggle("hidepad", !showPad);

  /* ── 게임 화면 크기 — 위에 적은 공식 ─────────────────────────────── */
  const minSide = showPad ? MIN_SIDE_PAD : MIN_SIDE_BARE;
  const aspect = SW / SH;
  /* 위아래로 조금 띄웁니다 (테두리와 안내줄 자리) */
  let gh = dh - 10;
  let gw = Math.round(gh * aspect);
  const maxW = dw - minSide*2;
  if (gw > maxW) { gw = Math.max(80, maxW); gh = Math.round(gw / aspect); }
  /* 아주 좁은 기기에서도 최소한은 보이게 */
  if (gh > dh - 10) { gh = dh - 10; gw = Math.round(gh * aspect); }

  const gx = Math.round((dw-gw)/2), gy = Math.round((dh-gh)/2);

  const stg = $("stage");
  /* ★ 좌우 선은 위아래 끝까지 (바깥 테두리에 딱 붙습니다).
       세로 여백이 아예 없으므로 쏠릴 것도 없습니다. */
  stg.style.left=(gx-2)+"px"; stg.style.top="0px";
  stg.style.width=(gw+4)+"px"; stg.style.height=dh+"px";
  /* ★ 캔버스의 **그림 크기**(width/height 속성)는 에뮬레이터가 정합니다.
       여기서는 **보이는 크기**(style)만 정합니다. 둘을 헷갈리면
       화면이 뭉개지거나 늘어납니다. */
  $("screen").style.width=gw+"px"; $("screen").style.height=gh+"px";
  $("screen").style.top=gy+"px";
  /* ★ GBA 캔버스도 같이 재웁니다. 두 캔버스가 겹쳐 있고 시스템에 따라
       한쪽만 보입니다 — 크기를 안 맞추면 GBA 가 원래 크기(240×160)로
       조그맣게 박힙니다. */
  /* ★★ 여기서 **보이고 숨기는 판단을 하면 안 됩니다.** ★★
       fit() 은 창 크기가 바뀔 때만 돕니다(같은 크기면 첫 줄에서 그냥
       돌아갑니다). 그래서 여기에 두면 **게임을 켜도 화면이 안 나오고**,
       브라우저를 전체화면으로 했다 돌리는 식으로 크기를 바꿔야 그제서야
       나옵니다. 실제로 GBA 가 그 증상이었습니다.
       보이기/숨기기는 화면 상태가 바뀔 때마다 도는 draw() 가 맡습니다. */
  { const cg = $("screenGba");
    cg.style.width=gw+"px"; cg.style.height=gh+"px"; cg.style.top=gy+"px"; }
  const pg = $("page");
  pg.style.left="0px"; pg.style.top=gy+"px"; pg.style.width=gw+"px"; pg.style.height=gh+"px";

  $("paneL").style.left="0px";        $("paneL").style.width=gx+"px";
  $("paneR").style.left=(gx+gw)+"px"; $("paneR").style.width=(dw-gx-gw)+"px";

  /* ── ★ 구석 존 (오른쪽 판의 맨 위) ────────────────────────────────
     ★★ 게임 화면 **밖**에 놓는 것이 핵심입니다.
       처음에는 기기의 오른쪽 위 구석(right:8px)에 붙였는데, 좁은 기기나
       GBA 처럼 화면이 넓은 경우 **게임 화면 오른쪽 위를 20px 쯤 덮었습니다.**
       배치를 그림으로 뽑아 보고서야 알았습니다.
       이제 게임이 끝나는 자리(gx+gw)부터 시작하므로 겹칠 수가 없습니다.  */
  const rw0 = dw - gx - gw;                  /* 오른쪽 판 폭 */
  const zoneW = Math.max(44, rw0 - 12);
  const zone = $("zone");
  /* ★ 화면이 낮은 기기(아이폰SE 1세대 같은 옛 폰)에서는 버튼을 낮춥니다.
       안 그러면 존이 SELECT 알약 위로 몇 픽셀 내려앉습니다.
       (배치를 그림으로 뽑아 재고서 알았습니다 — 568x320 에서 2px 겹쳤습니다.) */
  const zh = dh < 340 ? 23 : 28;
  const zoneH = zh * 3 + 5 * 2;              /* 버튼 3개 + 사이 간격 */
  zone.style.left  = Math.round(gx + gw + 6) + "px";
  zone.style.top   = "6px";
  zone.style.width = zoneW + "px";
  zone.style.height = zoneH + "px";
  zone.style.right = "auto";
  zone.style.setProperty("--zh", zh + "px");
  /* 존이 끝나는 높이 — 안내글은 그 아래부터 */
  const zoneBottom = 6 + zoneH;

  /* ★★ 조작판을 껐을 때 숨겨야 하는 것들을 **일찍** 처리합니다. ★★
       아래에서 일찍 돌아가기 때문에, 여기서 안 끄면 영영 못 끕니다.
       특히 L·R 은 인라인 display 를 쓰는데 인라인은 CSS(.hidepad)를 이깁니다.
       그래서 조작판을 껐는데 **L·R 만 유령처럼 남아 있었습니다.**
       (게임보이로 돌아가도 남았습니다.) 2026-08-11 교차검사에서 잡았습니다. */
  const isGba = st8.systemId === "gba";
  const shH = 30, shGap = 10;
  for (const id of ["btnL", "btnR"])
    $(id).style.display = (showPad && isGba) ? "flex" : "none";
  /* 안내글도 마찬가지 — 조작판을 끄면 오른쪽 판이 좁아서 자리가 없습니다.
     안 끄면 옛 배치가 그대로 남아 구석 존 자리에 겹쳐 얹힙니다. */
  $("info").style.display = showPad ? "block" : "none";

  if (!showPad) { $("diag").textContent = `${W}x${H}`; return; }

  /* ── 게임 버튼 자리 ───────────────────────────────────────────────
     NES 패드처럼 **십자키와 A·B 를 같은 높이**에 둡니다.
     SELECT·START 는 A·B 에서 넉넉히 띄웁니다 — 가까우면 게임 중에
     엄지가 스치면서 눌립니다. 크기는 전부 고정입니다.               */
  const rw   = dw - gx - gw;
  const bs   = 58;          /* 동그란 버튼 지름 (44 는 너무 작아 자꾸 빗나갔습니다) */
  const gapB = 16;          /* B 와 A 사이 */
  const pillW = 48, pillH = 18;
  const GAP_PILL_BTN = 30;  /* SELECT·START 와 A·B 사이. 넉넉히. */

  /* ★ A·B 중심 높이 — 십자키도 여기에 맞춥니다. */
  const PAD_TARGET = 110;
  const ctrY = dh - Math.max(26 + bs/2, PAD_TARGET/2 + 26);

  const bx = Math.round((rw - (bs*2+gapB)) / 2);
  const byTop = Math.round(ctrY - bs/2);
  place($("btnB"), bx, byTop, bs, bs);
  place($("btnA"), bx+bs+gapB, byTop, bs, bs);

  /* ★ GBA 의 L·R — A·B 바로 위 (사용자 지정).
       터치로는 보조입니다. GBA 는 블루투스 패드 사용이 기본 상정입니다.
       보이기/숨기기는 위(일찍 돌아가기 전)에서 이미 정했습니다. */
  const shY = byTop - shGap - shH;
  place($("btnL"), bx,            shY, bs, shH);
  place($("btnR"), bx+bs+gapB,    shY, bs, shH);

  /* SELECT·START 알약 + 이름표 — GBA 면 L·R 위로 더 올립니다 */
  const px = Math.round((rw - (pillW*2+gapB)) / 2);
  const py = (isGba ? shY : byTop) - GAP_PILL_BTN - pillH;
  place($("btnSel"), px, py, pillW, pillH);
  place($("btnSta"), px+pillW+gapB, py, pillW, pillH);
  place($("lblSel"), px, py-15, pillW);
  place($("lblSta"), px+pillW+gapB, py-15, pillW);

  /* 안내글은 구석 존 아래부터 SELECT 이름표 위까지.
     ★ 존 아래에서 시작해야 합니다. 겹치면 글자가 버튼 밑에 깔립니다. */
  const infoTop = zoneBottom + 8;
  const infoH = Math.max(0, py - 14 - infoTop);
  $("info").style.left = "10px";
  $("info").style.top  = infoTop + "px";
  $("info").style.width  = (rw-18) + "px";
  $("info").style.height = infoH + "px";
  /* ★ 자리가 거의 없으면 아예 감춥니다. 한 줄만 잘려 보이는 것보다 낫습니다.
       (아이폰SE 급 가로 + 사파리 툴바가 보이는 상태가 이 구간입니다.) */
  $("info").style.display = infoH >= 24 ? "block" : "none";

  /* ── 왼쪽 판 ───────────────────────────────────────────────────────
     ★ 십자키 중심을 A·B 와 같은 높이에 맞춥니다.
       위아래로 삐져나가지 않게 크기를 줄여서 맞춥니다.              */
  const fw = 30, fh = 24, fgap = 8, fTop = 10;
  const roomUp   = ctrY - (fTop + fh + 14);      /* 글자크기 버튼 아래까지 */
  const roomDown = dh - ctrY - 22;               /* 아래 여백 (하단 막대 자리) */
  let ps = Math.min(PAD_TARGET, gx - 26, roomUp * 2, roomDown * 2);
  ps = Math.max(56, Math.floor(ps));
  const ph = $("padHint");
  ph.style.width = ps + "px"; ph.style.height = ps + "px";
  ph.style.left = Math.round((gx - ps) / 2) + "px";
  ph.style.top  = Math.round(ctrY - ps/2) + "px";
  /* ★ 글자는 십자키 위에. 아래에 두면 화면 맨 아래 막대와 겹칩니다. */
  $("lblMove").style.left = Math.round((gx - 32) / 2) + "px";
  $("lblMove").style.top  = Math.round(ctrY - ps/2 - 13) + "px";

  const fx = Math.round((gx - (fw*2+fgap)) / 2);
  place($("fsDn"), fx, fTop, fw, fh);
  place($("fsUp"), fx+fw+fgap, fTop, fw, fh);

  $("diag").textContent = `${W}x${H}`;
}

/* ══ 그리기 ═══════════════════════════════════════════════════════════ */
function draw(){
  /* ★ 줄을 새로 그리면 "누르고 있음" 표시가 사라집니다.
       그런데 시계는 살아 있어서, 아무 표시 없이 지우기 창이 튀어나옵니다.
       (글자 크기 버튼 하나만 눌러도 이 일이 벌어졌습니다.) */
  if (holdCancel) holdCancel();
  const st = ui.state, pg = $("page"), inf = $("info"), sc = $("screen");
  const playing = st.screen === "play";
  /* ★★ 어느 캔버스를 보일지는 **여기서** 정합니다. ★★
       게임보이·컬러는 binjgb 가 #screen 에 2D 로 그리고, GBA 는 mGBA 가
       #screenGba 에 제 방식으로 그립니다. 한 캔버스에 두 방식을 같이
       못 붙여서 캔버스가 둘입니다. 같은 자리에 겹쳐 있고 한쪽만 보입니다.

     ★ 전에는 이 판단이 fit() 안에 있었습니다. fit() 은 **창 크기가 바뀔
       때만** 도는 함수라(같은 크기면 첫 줄에서 돌아갑니다), 게임을 켜도
       화면이 안 나오고 브라우저 크기를 바꿔야 그제서야 나왔습니다.
       draw() 는 화면 상태가 바뀔 때마다 도니 여기가 제자리입니다. */
  const onGba = playing && st.systemId === "gba";
  sc.style.visibility = (playing && !onGba) ? "visible" : "hidden";
  $("screenGba").style.visibility = onGba ? "visible" : "hidden";
  pg.style.display = playing ? "none" : "block";
  /* ★ 여기를 "게임 중이면 무조건 안 띄움" 으로 막으면 안 됩니다.
       배터리 세이브 실패("COULD NOT SAVE") 는 **게임 중에 반드시** 떠야
       하는 안내입니다. 실제로 그렇게 막았다가 검사에 걸렸습니다.
       띄우지 말아야 할 것은 안내를 **세우지 않는 쪽**에서 막습니다
       (색 토글 참고 — 구석 버튼에 이미 COLOR/AMBER 라고 적혀 있습니다). */
  $("note").textContent = st.notice || "";

  /* ── 구석 존 ─────────────────────────────────────────────────────── */
  $("zMain").textContent = ui.cornerLabel();
  /* 컬러·조작판 토글은 **게임 화면이 있을 때만** 뜻이 있습니다.
     목록에서 CLR 을 눌러도 눈에 보이는 변화가 없으면 고장인 줄 압니다. */
  const showToggles = playing || st.screen === "menu";
  $("zClr").style.display = showToggles ? "flex" : "none";
  $("zClr").textContent = st.colorReal ? "COLOR" : "AMBER";
  $("zClr").classList.toggle("off", !st.colorReal);
  $("zPad").style.display = "flex";
  $("zPad").textContent = "PAD";
  $("zPad").classList.toggle("off", !st.padVisible);

  if (st.screen === "system"){
    pg.innerHTML = "<h2>SELECT SYSTEM</h2>" + ui.systems().map((s,i) =>
      `<div class="row ${i===st.cursor?"sel":""}" data-s="${s.id}">
         <div class="t">${s.name}</div><div class="sub">${s.desc}</div></div>`
    ).join("");
    inf.innerHTML = `<div class="h">FIELD UNIT</div><hr>
      <div class="v">TAP A SYSTEM<br>TO OPEN IT</div><br>
      <div class="v">EXIT RETURNS<br>TO THE TEMPAD</div>`;
  }
  else if (st.screen === "list" && st.confirm){
    /* ★ 지우기는 되돌릴 수 없습니다 (세이브까지 같이 사라집니다).
         그래서 목록을 감추고 이 화면만 보여줍니다.
         목록이 보이면 "어느 것을 지우는지" 헷갈립니다. */
    const cold = (Date.now() - armAt) < ARM_MS;
    pg.innerHTML = `<h2>DELETE GAME?</h2>
      <div class="ask">
        <b>${esc(st.confirm.title)}</b>
        <span class="warn">THIS ALSO DELETES ITS SAVES. FOREVER.</span>
      </div>
      <div class="ask2 ${cold?"cold":""}">
        <div class="b keep" data-ask="keep">KEEP</div>
        <div class="b del"  data-ask="del">DELETE</div>
      </div>`;
    inf.innerHTML = `<div class="h">DELETE?</div><hr>
      <div class="v">TAP KEEP TO<br>GO BACK.<br><br>
      NOTHING ELSE<br>DELETES IT.</div>`;
    /* 잠깐 잠갔던 버튼을 제때 풀어줍니다 */
    if (cold) setTimeout(() => { if (ui.state.confirm) draw(); }, ARM_MS);
  }
  else if (st.screen === "list"){
    const list = ui.list();
    pg.innerHTML = "<h2>" + esc(ui.systemName()) + "</h2>"
      /* ★ 글자가 **실제로 열리는 창**과 맞아야 합니다.
           폴더가 되는 기기(안드로이드·PC)에서는 폴더 고르기가 열립니다.
           아이폰은 폴더 고르기가 없어서 파일 여러 개 고르기가 열립니다.
           같은 글자를 쓰면 한쪽은 반드시 거짓말이 됩니다. */
      + `<div class="row add" data-add="1"><div class="t">+ ADD GAME${CAN_DIR ? " FOLDER" : ""}</div></div>`
      /* ★ zip 은 줄을 따로 둡니다.
           안드로이드에서 "+ ADD GAME" 은 **폴더 고르기**를 여는데,
           거기서는 zip 파일을 고를 수가 없습니다. 그러면 이 기능이
           아이폰 전용이 되어버립니다. 아드님 폰이 갤럭시라 치명적입니다.
           이 줄은 어느 폰에서든 **파일 고르기**를 엽니다.
         ★ GameZip 이 없으면(옛 서비스워커가 unzip.js 를 못 받아온 경우)
           줄을 아예 안 보여줍니다 — 눌러도 안 되는 버튼보다 낫습니다. */
      + (window.GameZip
          ? `<div class="row add" data-add="zip"><div class="t">+ ADD ZIP</div></div>`
          : ``)
      + (list.length
        ? list.map((r,i) =>
            /* data-i 로 몇 번째 줄인지 붙여둡니다. 길게 누르기가 이걸 봅니다. */
            `<div class="row ${i===st.cursor?"sel":""}" data-i="${i}">
               <div class="t">${esc(r.title)}</div>
               <div class="sub">${esc((r.hasSram?"SAVE ":"")
                 + (r.states.some(Boolean)?"STATE ":"") + (r.note||""))}</div>
               <div class="hold"></div></div>`
          ).join("")
        : `<div class="empty">NO GAMES HERE YET.<br><br>TAP + ADD GAME${CAN_DIR ? " FOLDER" : ""}.</div>`);
    inf.innerHTML = `<div class="h">${list.length} GAME${list.length===1?"":"S"}</div><hr>
      <div class="v">
        TAP ONCE TO PICK<br>
        TAP AGAIN TO PLAY<br><br>
        HOLD A GAME<br>TO DELETE IT
      </div>`;
  }
  else if (st.screen === "menu"){
    pg.innerHTML = `<h2>PAUSED</h2>` +
      ui.menuItems().map((m,i) => {
        const sel = i===st.cursor?"sel":"";
        if (m.slot === undefined)
          return `<div class="row one ${sel}" data-m="${i}">
                    <div class="t">${m.label}</div><span class="sub">${m.sub}</span></div>`;
        /* ★ 저장 칸은 줄마다 버튼 두 개. v1 처럼 A/START 에 걸지 않습니다. */
        return `<div class="row one ${sel}" data-m="${i}">
                  <div class="t">${m.label}</div><span class="sub">${m.sub}</span>
                  <div class="mini" data-m="${i}" data-act="load">LOAD</div>
                  <div class="mini" data-m="${i}" data-act="save">SAVE</div>
                </div>`;
      }).join("");
    inf.innerHTML = `<div class="h">${esc(st.title)}</div><hr>
      <div class="v">
        TAP TO CHOOSE<br><br>
        SLOTS KEEP THE<br>EXACT MOMENT
      </div>`;
  }
  else {
    inf.innerHTML = `<div class="h">${esc(st.title)}</div><hr>
      <div class="v">PLAYING</div><br>
      <div class="v">MENU BUTTON<br>&nbsp;&nbsp;SAVE / QUIT</div><br>
      <div class="v">PAD: SELECT<br>&nbsp;&nbsp;+ L + R</div>`;
  }

  /* ★ 고른 줄이 화면 밖으로 나가지 않게 따라갑니다.
       목록이 길어지면 커서만 아래로 가고 화면은 그대로여서
       "아무 반응이 없다"고 느끼게 됩니다.                              */
  const selEl = pg.querySelector(".row.sel");
  if (selEl && selEl.scrollIntoView) selEl.scrollIntoView({ block:"nearest" });
}

/* ★★ 지금 눌려 있는 것을 전부 놓습니다 — 터치와 게임패드 **양쪽 다**. ★★

   게임 중에 블루투스 패드로 오른쪽을 **누른 채** 화면의 MENU 를 누르면,
   화면은 메뉴로 넘어갑니다. 그 뒤에 방향을 떼면 onPress 가
   "게임 화면이 아니니 무시" 하고 **뗌을 버립니다.** 그러면 에뮬레이터에는
   누름만 남아서, RESUME 했을 때 **손을 뗐는데 캐릭터가 계속 걸어갑니다.**
   (2026-08-11 교차검사에서 재현해서 잡았습니다.)

   그래서 화면을 옮기기 전에 눌린 것을 전부 놓아줍니다.
   ★ onPress 가 아니라 GameMode.press 로 직접 보냅니다 — onPress 는
     게임 화면이 아니면 뗌을 버리기 때문입니다.                          */
function releaseAllInput(){
  try { if (pad) pad.releaseAll(); } catch (e) {}
  for (const n of gpPrev) { try { GameMode.press(n, false); } catch (e) {} }
  gpPrev = []; gpMenu = false;
}

/* ══ 조작 (게임패드·키보드 보조 입력) ═════════════════════════════════
   ★★ v2 — 게임 버튼은 게임에만 들어갑니다. ★★
     목록과 메뉴는 손가락이 주인이고, 게임패드 십자키·A·B 는 거들기만 합니다.
     SELECT·START 로는 메뉴에서 아무 일도 일어나지 않습니다.
     지우기는 화면 버튼으로만 됩니다 — 되돌릴 수 없는 일이라 그렇습니다. */
function onPress(name, down){
  if (ui.state.screen === "play"){ ui.press(name, down); return; }

  if (!down) return;                      /* 목록에서는 누를 때만 반응 */
  const st = ui.state;
  if (name === "up")   { ui.move(-1); draw(); return; }
  if (name === "down") { ui.move(1);  draw(); return; }

  if (st.screen === "system"){
    if (name === "A") ui.pickSystem(ui.systems()[st.cursor].id).then(() => { lastFitKey=""; fit(); draw(); });
    return;
  }
  if (st.screen === "list"){
    if (st.confirm){
      /* ★ 패드로는 **안 지움** 만 됩니다. 지우기는 화면 버튼 전용입니다.
           손에 쥔 패드를 아무렇게나 눌러 게임이 사라지면 안 됩니다. */
      if (Date.now() - armAt < ARM_MS) return;
      ui.cancelRemove(); draw();
      return;
    }
    if (name === "A")      ui.play().then(draw);
    else if (name === "B") { ui.backToSystem(); draw(); }
    return;
  }
  if (st.screen === "menu"){
    if (name === "A")      ui.chooseMenu("load").then(draw);
    else if (name === "B") { ui.closeMenu(); draw(); }
    return;
  }
}

/* ══ 시작 ═════════════════════════════════════════════════════════════ */
/* 시스템에 맞는 에뮬레이터를 준비합니다.
   ★ 게임보이와 컬러는 binjgb 하나가 둘 다 봅니다 (롬 헤더를 보고 스스로
     컬러 모드로 갑니다). GBA 만 다른 코어입니다. */
/* ★ GBA 코어는 **고른 순간에** 부릅니다 (파일이 1.7MB 쯤 됩니다).
     파일이 없으면 조용히 실패하고, 화면에 "GBA EMULATOR NOT AVAILABLE" 이 뜹니다.
     검은 화면보다 낫습니다.

     ★ game/mgba.js 를 넣기만 하면 이 길이 그대로 살아납니다.
       그 파일은 window.MgbaCore = { load() } 만 내놓으면 됩니다.
       (load() 는 game.js 의 GameMode.registerCore("gba", SessionClass) 를
        불러 코어를 등록하고, start 에 넘길 module 을 돌려줍니다.) */
let mgbaLoading = null;
function loadMgba(){
  if (window.MgbaCore) return Promise.resolve();
  if (mgbaLoading) return mgbaLoading;
  mgbaLoading = new Promise((res, rej) => {
    let done = false;
    const finish = okNow => { if (done) return; done = true;
                              okNow && window.MgbaCore ? res() : rej(new Error("no-mgba")); };
    let s;
    try { s = document.createElement("script"); } catch (e) { rej(new Error("no-mgba")); return; }
    s.onload  = () => finish(true);
    s.onerror = () => finish(false);
    /* ★ mgba.js 를 직접 부르면 안 됩니다 — 그건 **ES 모듈**이라
         <script src> 로는 안 뜹니다(조용히 실패합니다).
         평범한 스크립트인 껍데기를 부르고, 껍데기가 import() 로 알맹이를
         불러옵니다. */
    s.src = "mgba-glue.js";
    try { (document.body || document.documentElement).appendChild(s); }
    catch (e) { finish(false); }
  });
  /* 실패했으면 다음에 다시 해볼 수 있게 풀어둡니다 */
  mgbaLoading.catch(() => { mgbaLoading = null; });
  return mgbaLoading;
}

async function loadCore(system){
  if (system === "gba"){
    if (mgbaMod) return mgbaMod;
    await loadMgba();
    if (!window.MgbaCore) throw new Error("no-mgba");
    mgbaMod = await window.MgbaCore.load();
    return mgbaMod;
  }
  if (wasmMod) return wasmMod;
  if (typeof Binjgb !== "function") throw new Error("no-binjgb");
  wasmMod = await Binjgb();
  return wasmMod;
}

async function fetchRom(path){
  const res = await fetch(path);
  if (!res.ok) throw new Error("rom-missing");
  return new Uint8Array(await res.arrayBuffer());
}

/* ══ 글자 크기 ═══════════════════════════════════════════════════════
   ★ 읽는 글자만 바꿉니다. 버튼과 십자키는 고정입니다.
     템패드 본체와 같은 이름표를 써서 설정이 이어집니다.              */
const FS_KEY = "tempad.fs", FS_MIN = 9, FS_MAX = 26, FS_STEP = 1;
let fsNow = 13;

function applyFS(v){
  fsNow = Math.max(FS_MIN, Math.min(FS_MAX, Math.round(v)));
  document.documentElement.style.setProperty("--fs", fsNow + "px");
  try{ localStorage.setItem(FS_KEY, String(fsNow)); }catch(e){}
  $("fsDn").style.opacity = fsNow <= FS_MIN ? ".35" : "1";
  $("fsUp").style.opacity = fsNow >= FS_MAX ? ".35" : "1";
  lastFitKey = "";                      /* 글자가 바뀌면 다시 재야 합니다 */
  scheduleFit();
  if(ui) draw();                        /* 줄 높이가 바뀌니 다시 그립니다 */
}

function initFS(){
  let v = 0;
  try{ v = Number(localStorage.getItem(FS_KEY)); }catch(e){}
  if(!isFinite(v) || v < FS_MIN || v > FS_MAX){
    /* 저장된 게 없으면 손가락으로 쓰는 기기는 조금 크게 */
    v = matchMedia("(pointer:coarse)").matches ? 16 : 13;
  }
  applyFS(v);
}

/* 보기 설정 저장소 (컬러·조작판 토글) */
const PREFS = {
  get(k){ try { return localStorage.getItem("tempad.game." + k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem("tempad.game." + k, v); } catch(e){} },
};

function boot(){
  ui = new GameUi.Ui({
    store: GameMode.RomStore,
    engine: GameMode,
    readFile: GameMode.readFile,
    detectSystem: GameMode.detectSystem,
    fetchRom, loadCore,
    canvas: $("screen"),
    canvasGba: $("screenGba"),
    prefs: PREFS,
    /* ★ 화면 흐름 쪽이 **스스로 다시 그려야** 할 때가 있습니다.
         3초짜리 타이머에서 오는 저장 실패 안내 같은 것입니다.
         이게 없으면 안내를 세워놔도 아무도 안 그려서 영영 안 보입니다. */
    redraw: () => { try { draw(); } catch (e) {} },
    /* ★ 나가기 전에 십자키를 놓고 에뮬레이터를 정리해야 합니다.
         전에는 여기서 곧장 주소만 바꿔서, 눌린 키와 돌던 게임이
         그대로 남은 채 페이지를 떠났습니다. */
    onExit: () => { if (doLeave) doLeave();
                    else { try { location.replace("../"); } catch (e) { location.href = "../"; } } },
  });

  /* ★ 게임이 뜻하지 않게 사라지면(브라우저가 얼리거나 떠날 때) 화면도 따라 나옵니다.
       안 그러면 "PLAYING" 이라고 적힌 멈춘 화면에 갇힙니다. */
  GameMode.setOnGone(() => {
    if (ui.state.screen === "play" || ui.state.screen === "menu") {
      ui.quit().then(() => { ui.warn("GAME STOPPED"); draw(); });
    }
  });

  /* ★ 아이폰 소리 대책 — 손가락이 처음 닿는 순간에 소리 장치를 깨웁니다.
       게임 시작 시점은 이미 늦습니다 (기다린 뒤라 제스처가 끊깁니다). */
  document.addEventListener("pointerdown", () => GameMode.wakeAudio(), { capture:true });

  pad = new GamePad4.Pad({ onPress });
  pad.attach($("padArea"), [
    [$("btnA"), "A"], [$("btnB"), "B"],
    [$("btnSel"), "select"], [$("btnSta"), "start"],
    [$("btnL"), "L"], [$("btnR"), "R"],
  ]);

  /* 글자 크기 버튼 */
  onTap($("fsUp"), () => applyFS(fsNow + FS_STEP));
  onTap($("fsDn"), () => applyFS(fsNow - FS_STEP));
  initFS();

  /* ── ★ 구석 존 — 메뉴와 토글 ────────────────────────────────────────
     ★ 이 셋은 게임에 아무 입력도 안 보냅니다. 완전히 독립입니다. */
  onTap($("zMain"), async () => {
    releaseAllInput();                    /* 눌린 채 남지 않게 (터치+패드) */
    await ui.corner();
    draw();
  });
  onTap($("zClr"), () => { ui.toggleColor(); draw(); });
  onTap($("zPad"), () => {
    ui.togglePad();
    releaseAllInput();                    /* 숨기기 전에 눌린 것을 놓습니다 */
    lastFitKey = ""; fit(); draw();
  });

  /* ── 파일 / 폴더 받기 ────────────────────────────────────────────────
     둘 다 같은 곳으로 갑니다. 폴더를 고르면 그 안의 것이 전부 옵니다
     (하위 폴더까지). 거르는 일은 ui.addRoms 가 합니다.               */
  /* ★ 넣는 중에 또 넣기를 누르면 두 번이 겹쳐 돌아 숫자가 꼬입니다.
       (pending 은 지우기 확인만 막습니다.) zip 은 한 번에 들어오는 양이
       커서 도는 시간이 길어지므로, 여기서 처음으로 현실이 됩니다. */
  let importing = false;
  /* 넣는 중에 또 눌러서 **버려진 묶음** 수 */
  let droppedBatch = 0;

  /* ── ★ zip 펼치기 ─────────────────────────────────────────────────────
     고른 것 중에 zip 이 있으면 **그 안의 항목으로 바꿔서** 나머지 파일과
     합칩니다. 압축은 여기서 안 풉니다 — 목록만 만들고, 실제로 푸는 것은
     ui.addRoms 가 그 항목을 읽을 때입니다 (32MB 짜리를 한꺼번에 펼치지 않게).

     ★ zip 판정은 **이름이 아니라 앞 4바이트**로 합니다.
       이름만 .zip 인 엉뚱한 파일, 확장자 없이 오는 파일이 둘 다 있습니다. */
  async function expandZips(files){
    if (!window.GameZip) return { files, zipNote:"" };
    const out = [], notes = [];
    let sk = { folder:0, encrypted:0, method:0, junk:0, big:0, broken:0, nested:0 };
    for (const f of files){
      let isZip = false;
      try { isZip = await window.GameZip.looksLikeZip(f); } catch (e) {}
      if (!isZip) {
        /* ★ 이름은 .zip 인데 zip 이 아니면 **전송이 덜 된 것**입니다.
             (카톡 전송이 끊기면 앞부분만 옵니다. 22바이트도 안 되는 것은
              zip 판정 자체를 통과 못 합니다.)
             그냥 흘려보내면 "NOT A GAME FILE" 이 뜹니다 — 그건 "다시 받아라"
             가 아니라 "이 파일이 잘못됐다" 로 들려서 아드님이 헛물을 켭니다. */
        if (/\.zip$/i.test(String(f.name || ""))) { notes.push("BROKEN ZIP FILE — GET IT AGAIN"); continue; }
        out.push(f); continue;
      }
      try {
        const r = await window.GameZip.listEntries(f, { maxBytes: GameUi.MAX_ANY_BYTES });
        for (const e of r.entries) out.push(e);
        for (const k in sk) sk[k] += (r.skipped[k] || 0);
      } catch (err) {
        const m = String(err && err.message || "");
        notes.push(m === "UNSUPPORTED ZIP" ? "UNSUPPORTED ZIP" : "BROKEN ZIP FILE");
      }
    }
    /* ★ 안내문이 길어지면 작은 화면에서 잘립니다. zip 단계에서 버린 것은
         한 줄로 접습니다. 다만 **암호**는 따로 말해줘야 합니다 —
         아드님이 할 수 있는 일이 다르기 때문입니다. */
    const dropped = sk.encrypted + sk.method + sk.big + sk.broken;
    /* ★ zip 안에 또 zip 이 든 경우. 이 말을 안 해주면 "NO GAME FILES IN THERE"
         만 뜨는데, 정작 zip 안에는 게임이 잔뜩 들어 있습니다. */
    if (sk.nested) notes.push("ZIP INSIDE ZIP — UNPACK IT FIRST");
    if (sk.encrypted) notes.push("ZIP IS PASSWORD PROTECTED");
    else if (sk.method && !window.GameZip.canInflate())
      notes.push("UPDATE THE PHONE TO OPEN THIS ZIP");
    else if (dropped) notes.push(dropped + " SKIPPED IN ZIP");
    return { files: out, zipNote: notes.join(" / ") };
  }

  async function takeFiles(input){
    const picked = Array.from(input.files || []);
    /* ★ 값을 먼저 비웁니다. 같은 폴더를 두 번 골라도 반응하게. */
    input.value = "";
    if (!picked.length) return;
    if (importing) { droppedBatch++; ui.warn("STILL ADDING — WAIT"); draw(); return; }
    importing = true;
    try {
      $("note").textContent = "OPENING…";
      const { files, zipNote } = await expandZips(picked);

      if (!files.length){
        ui.warn(zipNote || "NO GAME FILES IN THERE");
        draw(); return;
      }
      /* ★ zip 에서 나온 것은 여러 개여도 한 개여도 addRoms 로 보냅니다.
           addRom(한 개짜리 길)은 크기·안내 처리가 파일 기준이라
           zip 항목과 안 맞습니다. */
      const fromZip = files.some(f => typeof f.read === "function");
      if (files.length === 1 && !fromZip){ await ui.addRom(files[0]); draw(); return; }

      let last = 0;
      await ui.addRoms(files, (now, total) => {
        if (now === total || now - last >= 1){
          last = now;
          $("note").textContent = `READING ${now} / ${total}`;
        }
      });
      /* zip 에서 버린 것이 있으면 뒤에 덧붙입니다 */
      if (zipNote) ui.warn(ui.state.notice ? ui.state.notice + " / " + zipNote : zipNote);
      draw();
    } catch (e) {
      ui.warn("COULD NOT ADD FILES"); draw();
    } finally {
      importing = false;
      /* ★★ 넣는 중에 또 눌러서 **버려진 묶음**이 있으면 반드시 말해줍니다.
           전에는 "STILL ADDING — WAIT" 가 잠깐 떴다가, 먼저 돌던 넣기가
           끝나면서 "ADDED 8" 로 **덮였습니다.** 아드님은 두 번째 zip 도 들어간
           줄 알고 넘어갑니다. 실제로는 통째로 버려졌습니다.
           마지막에 남는 글자가 거짓말이 되는 것이 제일 나쁩니다. */
      if (droppedBatch) {
        const n = droppedBatch; droppedBatch = 0;
        ui.warn((ui.state.notice ? ui.state.notice + " / " : "") +
                n + " MORE NOT ADDED — TRY AGAIN");
        draw();
      }
    }
  }
  $("file").addEventListener("change", e => takeFiles(e.target));
  $("dir") .addEventListener("change", e => takeFiles(e.target));
  $("zip") .addEventListener("change", e => takeFiles(e.target));

  /* 넣기 — 폴더가 되는 기기면 폴더, 아니면 파일 여러 개 */
  function openAdd(){ $(CAN_DIR ? "dir" : "file").click(); }
  /* zip 은 어느 기기에서든 파일 고르기 */
  function openZip(){ $("zip").click(); }

  /* ── ★ 안드로이드에서 "공유 → TEMPAD" 로 넘어온 파일 ─────────────────
     카톡에서 zip 을 공유하면 서비스워커가 받아 잠깐 넣어두고 여기로 보냅니다.
     저장했다가 다시 찾아 고를 필요가 없어집니다.
     ★ 아이폰에는 이 길이 없습니다. 그때는 아무 일도 안 일어납니다.        */
  /* ★★ 열쇠는 sw.js 와 **글자 하나까지 같아야** 합니다. ★★
       Cache API 는 "./shared" 같은 상대 주소를 **부르는 쪽 기준**으로 풉니다.
       sw.js 에서 넣으면 <뿌리>/shared, 이 화면에서 찾으면 <뿌리>/game/shared —
       서로 달라서 **넣어둔 것을 영영 못 찾습니다.** 실제로 그 상태였고,
       공유 기능이 통째로 한 번도 동작하지 않았습니다. 조용히 실패해서
       "아무 일도 안 일어남" 으로만 보입니다.
       origin 부터 붙여 어디서 부르든 같은 글자가 되게 못 박습니다. */
  const SHARE_BOX = "tempad-share";
  const SHARE_KEY = location.origin + "/__tempad-shared";

  async function takeShared(){
    try {
      const m = /[?&]shared=(\d+)/.exec(location.search);
      if (!m) return;
      const want = Number(m[1]);
      if (typeof caches === "undefined") return;
      /* ★ 다른 넣기가 도는 중이면 **아무것도 건드리지 않고** 물러납니다.
           여기서 주소나 캐시를 지워버리면, 넣기는 "STILL ADDING" 으로 버려지고
           새로고침해도 되찾을 길이 없어집니다(주소도 캐시도 이미 없음). */
      if (importing) { ui.warn("STILL ADDING — WAIT"); draw(); return; }
      const box = await caches.open(SHARE_BOX);
      /* 여러 개를 한꺼번에 공유할 수 있습니다. 번호를 붙여 넣어뒀습니다. */
      const got = [], keys = [];
      for (let i = 0; i < Math.max(want, 1) && i < 50; i++){
        const k = SHARE_KEY + "-" + i;
        const res = await box.match(k);
        if (!res) break;
        const blob = await res.blob();
        let name = "shared.zip";
        try { name = decodeURIComponent(res.headers.get("X-Name") || name); } catch (e) {}
        blob.name = name;
        got.push(blob); keys.push(k);
      }
      /* 주소는 지웁니다 — 새로고침마다 다시 시도하지 않게 */
      try { history.replaceState(null, "", "./index.html"); } catch (e) {}
      if (!got.length){
        /* ★ 공유가 왔는데 파일이 없으면 **그렇다고 말해줍니다.**
             전에는 화면만 열리고 끝이라, 아무 일도 안 일어난 것과
             구분이 안 됐습니다. 아드님은 앱이 고장난 줄 압니다.
           ★ 개수가 0 이어도 말해줍니다 — 그건 서비스워커가 파일을 아예
             못 받았다는 뜻이라, 오히려 더 확실한 실패입니다. */
        ui.warn("SHARE FAILED — USE [+ ADD ZIP]"); draw();
        return;
      }
      await takeFiles({ files: got, value: "" });
      /* ★ 지우는 것은 넣기가 **끝난 뒤**입니다. 먼저 지우면 중간에 잘못됐을 때
           zip 이 통째로 사라져 되돌릴 수 없습니다. */
      for (const k of keys) await box.delete(k);
    } catch (e) { /* 공유 받기가 실패해도 앱은 정상으로 굴러갑니다 */ }
  }

  /* ── ★★ 목록·메뉴를 손가락으로 ★★ ─────────────────────────────────
     줄은 그릴 때마다 새로 만들어지므로, 듣는 쪽은 #page 에 한 번만 답니다.

     짧게 누름 → 그 줄로 커서 이동. 이미 고른 줄이면 시작.
     길게 누름 → 지울까 물어봄.

     [ 반드시 챙겨야 하는 것 ]
       · 손가락이 움직이면 취소 (스크롤하려던 것이지 지우려던 게 아님)
       · pointercancel 도 취소 (전화가 오면 옴)
       · 길게 눌러 확인창이 뜬 뒤에는 손을 떼도 아무 일 없어야 함
       · 두 번째 손가락이 첫 번째 상태를 덮어쓰면 안 됨 (pointerId 로 묶기) */
  /* ★ 600ms 는 너무 짧습니다.
       안드로이드가 "길게 누름" 으로 치는 기본값이 500ms, 아이폰도 0.5초입니다.
       즉 600ms 는 **망설이는 탭**과 겨우 100ms 차이입니다. */
  const HOLD_MS = 900;

  let holdT = null, holdRow = null, holdI = -1, holdId = null,
      holdX = 0, holdY = 0, tapTarget = null;

  function cancelHold(){
    if (holdT) { clearTimeout(holdT); holdT = null; }
    if (holdRow) { holdRow.classList.remove("holding"); holdRow = null; }
    holdI = -1; holdId = null;
    if (tapTarget) { tapTarget.classList.remove("press"); tapTarget = null; }
  }
  /* ★ draw() 가 줄을 통째로 새로 그리면 막대는 사라지는데 시계는 살아남습니다.
       그러면 아무 예고 없이 지우기 창이 튀어나옵니다. 같이 끄게 연결합니다. */
  holdCancel = cancelHold;

  /* 눌린 자리에서 "무엇을 눌렀는지" 를 찾습니다.
     ★ 안쪽 것을 먼저 봅니다 — LOAD/SAVE 는 메뉴 줄 **안에** 있습니다. */
  function hit(e){
    const t = e.target;
    if (!t || !t.closest) return null;
    const act  = t.closest("[data-act]");
    if (act)  return { kind:"act",  el:act, i:Number(act.dataset.m), act:act.dataset.act };
    const ask  = t.closest("[data-ask]");
    if (ask)  return { kind:"ask",  el:ask, ask:ask.dataset.ask };
    const add  = t.closest("[data-add]");
    if (add)  return { kind:"add",  el:add };
    const sys  = t.closest("[data-s]");
    if (sys)  return { kind:"sys",  el:sys, id:sys.dataset.s };
    const men  = t.closest("[data-m]");
    if (men)  return { kind:"menu", el:men, i:Number(men.dataset.m) };
    const row  = t.closest(".row[data-i]");
    if (row)  return { kind:"row",  el:row, i:Number(row.dataset.i) };
    return null;
  }

  $("page").addEventListener("pointerdown", e => {
    /* ★ 이미 다른 손가락이 누르고 있으면 무시합니다.
         전에는 두 번째 손가락이 첫 번째의 상태를 덮어써서,
         빈 곳을 톡 쳤는데 게임이 켜지는 일이 있었습니다. */
    if (holdId !== null) return;
    /* ★ 게임 중에는 목록이 숨겨져 있어서(display:none) 원래 여기까지 안 옵니다.
         그래도 막아둡니다 — 어떤 브라우저가 숨긴 요소에 이벤트를 배달해도
         게임 중에 파일창이 열리거나 목록으로 튕기는 일이 없게. */
    if (ui.state.screen === "play") return;
    const h = hit(e);
    if (!h) return;
    holdId = e.pointerId;
    holdX = e.clientX; holdY = e.clientY;
    tapTarget = h.el;
    h.el.classList.add("press");

    /* 게임 줄만 길게 눌러 지울 수 있습니다 */
    if (h.kind === "row"){
      holdRow = h.el; holdI = h.i;
      /* 막대가 차오르는 걸 보여줍니다 — 얼마나 더 눌러야 하는지 알게 */
      h.el.classList.add("holding");
      holdT = setTimeout(() => {
        holdT = null;
        const i = holdI;
        cancelHold();
        /* ★ 지울 수 있는 것일 때만 진동합니다.
             기본 게임은 못 지우는데도 부르르 떨면, "떨렸으니 지워지는구나" 를
             잘못 배웁니다. 그 학습이 나중에 확인창을 안 읽게 만듭니다. */
        if (ui.askRemove(i)) {
          armAt = Date.now();
          try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
        }
        draw();
      }, HOLD_MS);
    }
  }, { passive:true });

  $("page").addEventListener("pointermove", e => {
    if (holdId === null || e.pointerId !== holdId) return;
    /* 10px 넘게 움직였으면 스크롤하려는 것입니다 */
    if (Math.abs(e.clientX - holdX) > 10 || Math.abs(e.clientY - holdY) > 10) cancelHold();
  }, { passive:true });

  $("page").addEventListener("pointerup", async e => {
    if (holdId === null || e.pointerId !== holdId) return;
    const wasRow = holdI;
    const target = tapTarget;
    cancelHold();
    if (!target) return;
    if (ui.state.screen === "play") return;   /* 게임 중에는 안 받습니다 */
    /* 손을 뗀 자리가 누르기 시작한 자리와 다르면 취소입니다 */
    const h = hit(e);
    if (!h || h.el !== target) return;

    const st = ui.state;

    if (h.kind === "ask"){
      /* ★ 창이 뜬 직후 잠깐은 아무것도 안 받습니다.
           길게 누르던 손가락을 떼면서 다른 버튼이 같이 눌리는 걸 막습니다. */
      if (Date.now() - armAt < ARM_MS) return;
      if (h.ask === "del") await ui.confirmRemove();
      else                 ui.cancelRemove();
      draw(); return;
    }
    if (st.confirm) return;               /* 확인 중에는 다른 건 안 받습니다 */

    if (h.kind === "add"){
      /* data-add="zip" 이면 zip 전용 파일 고르기 */
      if (h.el && h.el.dataset && h.el.dataset.add === "zip") openZip();
      else openAdd();
      return;
    }
    if (h.kind === "sys"){
      await ui.pickSystem(h.id);
      lastFitKey = ""; fit(); draw(); return;
    }
    if (h.kind === "act"){
      await ui.tapMenu(h.i, h.act);
      draw(); return;
    }
    if (h.kind === "menu"){
      await ui.tapMenu(h.i, "load");
      draw(); return;
    }
    if (h.kind === "row" && wasRow >= 0){
      await ui.tapRow(wasRow);
      draw(); return;
    }
  }, { passive:true });

  /* ★ 전화·알림, 그리고 **스크롤이 시작될 때** 여기로 옵니다.
       iOS 사파리는 스크롤을 넘기는 순간 pointermove 를 끊고
       pointercancel 만 보냅니다. 위의 10px 판정은 거기서 안 돕니다. */
  /* ★ lostpointercapture 도 듣습니다. 이게 없으면 어떤 사정으로 pointerup 이
       유실됐을 때 holdId 가 영영 안 풀리고, 그러면 **#page 전체가 탭을
       안 받습니다** (맨 위 "이미 다른 손가락이 있으면 무시" 때문에). */
  for (const t of ["pointercancel", "pointerleave", "lostpointercapture"])
    $("page").addEventListener(t, e => {
      if (holdId !== null && e && e.pointerId !== undefined && e.pointerId !== holdId) return;
      cancelHold();
    }, { passive:true });
  $("page").addEventListener("scroll", () => cancelHold(), { passive:true });

  /* ── 템패드로 돌아가기 ────────────────────────────────────────────────
     ★ 나가기 전에 반드시 에뮬레이터를 정리합니다.
       페이지를 떠나면 어차피 다 사라지지만, 저장이 날아가지 않게
       마지막 저장을 하고 나가야 합니다.
     ★ replace 를 씁니다. href 로 오가면 기록이 쌓여서
       본체의 종료 버튼이 창을 못 닫게 됩니다. */
  function leave(){
    try { if (pad) pad.releaseAll(); } catch (e) {}
    try { GameMode.stop(); } catch (e) {}
    try { location.replace("../"); } catch (e) { location.href = "../"; }
  }
  doLeave = leave;

  /* ── ★ 블루투스 게임패드 ────────────────────────────────────────────
     꽂으면 저절로 잡힙니다. 설정할 것 없습니다.
     터치 조작은 그대로 살아 있어서 둘 다 동시에 쓸 수 있습니다.

     ★ 브라우저는 **버튼을 한 번 누르기 전까지** 패드를 안 알려줍니다
       (몰래 기기를 알아내는 걸 막으려고). 그래서 "연결됨" 이 늦게
       뜨는 게 정상입니다. 아무 버튼이나 한 번 누르면 잡힙니다.

     ★★ v2 — MENU 는 **SELECT + L + R 을 한꺼번에** 눌러야 열립니다.
       v1 은 L 이나 R 혼자였는데, GBA 는 L·R 이 진짜 게임 버튼이라
       게임 중에 메뉴가 튀어나옵니다.                                  */
  function gpStop(){
    if (gpRaf) { cancelAnimationFrame(gpRaf); gpRaf = 0; }
    releaseAllInput();                    /* 눌린 채로 남지 않게 전부 놓습니다 */
  }

  function gpTick(){
    gpRaf = requestAnimationFrame(gpTick);
    let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) {}
    const raw = GamePad4.gamepadHeld(pads);
    /* 조합이 성립하면 SELECT·L·R 을 걷어냅니다 — 게임에 새어 들어가지 않게 */
    const { held, menu } = GamePad4.gamepadResolve(raw);
    const changes = GamePad4.gamepadEdges(gpPrev, held);
    gpPrev = held;

    /* 첫 입력 때 소리를 깨웁니다 (아이폰은 손짓이 있어야 소리가 납니다) */
    if (!gpSeen && (changes.length || menu)) {
      gpSeen = true; try { GameMode.wakeAudio(); } catch (e) {}
    }

    for (const [name, down] of changes) onPress(name, down);

    /* 조합은 **누르는 순간 한 번만** 반응합니다 (누르고 있는 동안 계속 아님) */
    if (menu && !gpMenu) {
      /* ★ releaseAllInput 이 눌린 것을 에뮬레이터에 놓아주고 gpPrev 를 비웁니다.
           비워도 됩니다 — 조합이 눌려 있는 동안은 gamepadResolve 가 셋을
           걷어내므로 새 눌림이 안 생기고, 조합을 놓으면 menu 가 false 로
           돌아가 다음에 다시 반응합니다. gpMenu 로 "한 번만" 을 지킵니다. */
      releaseAllInput();
      gpMenu = true;
      ui.corner().then(draw);
      return;
    }
    gpMenu = menu;
  }

  function gpStart(){ if (!gpRaf) { gpPrev = []; gpMenu = false; gpTick(); } }

  addEventListener("gamepadconnected", () => {
    $("diag").textContent = "GAMEPAD";
    gpStart();
  });
  addEventListener("gamepaddisconnected", () => {
    let left = 0;
    try { for (const p of (navigator.getGamepads() || [])) if (p) left++; } catch (e) {}
    if (!left) { gpStop(); lastFitKey = ""; scheduleFit(); }
  });
  /* 페이지에 들어올 때 이미 꽂혀 있을 수 있습니다 */
  try {
    for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) if (p) { gpStart(); break; }
  } catch (e) {}

  /* 다른 앱으로 가면 멈추고 버튼을 전부 뗍니다.
     안 그러면 배터리를 먹고, 돌아왔을 때 눌린 채로 남습니다. */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      gpStop();
      if (pad) pad.releaseAll();
    } else {
      try {
        for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) if (p) { gpStart(); break; }
      } catch (e) {}
    }
  });

  /* 폰의 뒤로가기로 나갈 때도 정리되게 */
  addEventListener("pagehide", () => {
    try { if (pad) pad.releaseAll(); } catch (e) {}
    try { GameMode.stop(); } catch (e) {}
  });
  document.addEventListener("contextmenu", e => e.preventDefault());

  /* ── 오른쪽이 잘릴 때 조절 ───────────────────────────────────────────
     폰마다 화면 크기 보고가 제각각이라 코드로는 못 맞춥니다.
     ★ v2 — 하단 진단 글자를 길게 눌러서 합니다.
       v1 은 START 를 길게 누르는 것이었는데, 그것도 게임 버튼에 메뉴
       기능을 겹쳐 건 것이라 없앴습니다.                                */
  let edgeT = null;
  $("diag").addEventListener("pointerdown", () => {
    edgeT = setTimeout(() => {
      edgeRight = (edgeRight + 8) % 48;
      lastFitKey = ""; fit();
      $("note").textContent = "RIGHT EDGE " + edgeRight;
    }, 900);
  }, { passive:true });
  for (const t of ["pointerup","pointercancel","pointerleave"])
    $("diag").addEventListener(t, () => clearTimeout(edgeT), { passive:true });

  /* 에뮬레이터 파일이 없으면 알려줍니다. 검은 화면보다 낫습니다. */
  if (typeof Binjgb !== "function"){
    ui.warn("EMULATOR FILES MISSING — SEE roms/ROMS.md");
  }
  /* ★ 아이폰 사파리는 **7일 안 쓰면 저장한 것을 통째로 지웁니다.**
       (WebKit 공식: 홈 화면에 추가한 앱은 예외)
       그래서 사파리로 그냥 열었을 때만 한 번 알려줍니다. */
  else try {
    const nav = (typeof navigator !== "undefined") ? navigator : null;
    const iOS = !!nav && /iPad|iPhone|iPod/.test(nav.userAgent || "");
    const mm = (typeof matchMedia === "function") ? matchMedia : null;
    const standalone = (nav && nav.standalone === true)
      || (mm && mm("(display-mode: standalone)").matches)
      || (mm && mm("(display-mode: fullscreen)").matches);
    if (iOS && !standalone) ui.warn("ADD TO HOME SCREEN TO KEEP SAVES");
  } catch (e) {}
  draw();
  /* ★ 공유로 넘어온 파일이 있으면 이어서 받습니다 (안드로이드). */
  takeShared();
}

addEventListener("resize", scheduleFit);
addEventListener("orientationchange", () => {
  insCache = null;                       /* 돌리면 노치 여백이 바뀝니다 */
  lastFitKey = "";
  setTimeout(scheduleFit, 300);
});
if (window.visualViewport){
  visualViewport.addEventListener("resize", scheduleFit);
  visualViewport.addEventListener("scroll", scheduleFit);
}
boot(); fit(); setTimeout(fit, 200); setTimeout(fit, 700);
</script>
</body>
</html>
