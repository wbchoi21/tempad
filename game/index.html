<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>TVA FIELD UNIT</title>
<!-- ============================================================================
     TVA FIELD UNIT — 게임 모드

     게임보이 에뮬레이터는 binjgb (MIT, Copyright 2017 Ben Smith)
     https://github.com/binji/binjgb

     [ 파일 구실 ]
       game.js  에뮬레이터 + 롬 보관 + 비정상 종료 방어
       ui.js    화면 흐름 (시스템 고르기 → 목록 → 플레이 → 메뉴)
       pad.js   터치 십자키
       이 파일  화면 그리기와 크기 맞추기

     로직은 전부 브라우저 없이 검사됩니다 →  node test/all.js
     ========================================================================= -->
<style>
:root{
  --or:#F8861E; --dim:#78420F; --mid:#A85C18; --bg:#040506;
  /* ★ 읽는 글자만 이 값을 따릅니다.
       버튼과 십자키는 손가락 크기라 고정입니다 — 글자를 키운다고
       버튼이 같이 커지면 화면 밖으로 나갑니다.
       템패드 본체와 같은 이름표(tempad.fs)를 써서 설정이 이어집니다. */
  --fs: 13px;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{
  width:100%; height:100%; background:var(--bg); overflow:hidden;
  font-family:ui-monospace,"Courier New",monospace; color:var(--or);
  /* 브라우저가 스크롤·확대·길게눌러선택으로 터치를 가로채는 걸 막습니다 */
  touch-action:none; user-select:none; -webkit-user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
#dev{ position:absolute; border:2px solid var(--or); border-radius:10px; overflow:hidden; }

/* ── 가운데 ────────────────────────────────────────────────────────── */
#stage{ position:absolute; border:2px solid var(--or); }
#screen{ display:block; image-rendering:pixelated; image-rendering:crisp-edges;
         background:var(--bg); }
/* 게임이 안 돌 때 이 위에 목록·메뉴를 그립니다 */
/* 목록이 화면보다 길어질 수 있어 스크롤을 켭니다.
   막대는 숨깁니다 — 기기처럼 보여야 하니까요. */
/* ★ body 는 touch-action:none 이라 손가락 스크롤이 막혀 있습니다.
     게임이 20개씩 되면 십자키로만 내려가야 해서 답답합니다.
     여기만 위아래 쓸기를 허락합니다 (좌우는 여전히 막습니다). */
#page{ position:absolute; overflow-y:auto; overflow-x:hidden; padding:6px 8px;
       scrollbar-width:none; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
#page::-webkit-scrollbar{ display:none; }
#page h2{ font-size:calc(var(--fs) * .85); letter-spacing:2px; color:var(--or);
          border-bottom:1px solid var(--dim); padding-bottom:3px; margin-bottom:5px; }
.row{ font-size:calc(var(--fs) * .85); line-height:1.4; letter-spacing:.5px; color:var(--mid);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1px 3px; }
.row.sel{ background:var(--or); color:var(--bg); }
.row .sub{ font-size:calc(var(--fs) * .68); color:var(--dim); }
/* 메뉴는 일곱 줄이 한 화면에 들어가야 해서 바짝 붙입니다.
   글자를 아주 크게 하면 넘치는데, 그때는 고른 줄이 따라 스크롤됩니다. */
.row.one{ display:flex; align-items:baseline; gap:6px;
          font-size:calc(var(--fs) * .8); line-height:1.15; padding:1px 3px; }
.row.one .sub{ margin-left:auto; font-size:calc(var(--fs) * .62); }
.row.sel .sub{ color:var(--bg); opacity:.8; }
#page .empty{ font-size:calc(var(--fs) * .78); color:var(--dim); line-height:1.7; margin-top:6px; }
/* 길게 누르는 동안 차오르는 막대 — "누르고 있으면 뭔가 된다"를 보여줍니다 */
/* ★ 막대는 실제 시간(0.9초)보다 조금 빨리 찹니다.
     꽉 찬 뒤에도 잠깐 여유가 있어야 "어, 이거 지워지겠다" 하고 뗄 수 있습니다.
     막대가 차는 순간이 곧 발동이면 경고 구간이 없는 셈입니다. */
.row .hold{ height:2px; background:var(--or); width:0; margin-top:2px;
            transition:width .65s linear; }
.row.holding .hold{ width:100%; }
/* 고른 줄은 바탕이 주황이라 같은 색 막대가 안 보입니다 */
.row.sel .hold{ background:var(--bg); }
/* 지울까 물어보는 화면 */
#page .ask{ font-size:calc(var(--fs) * .78); color:var(--or); line-height:1.6; margin-top:6px; }
#page .ask b{ display:block; color:var(--bg); background:var(--or);
              padding:1px 3px; margin:4px 0; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
#page .ask .warn{ color:var(--dim); }

/* ── 좌우 판 ───────────────────────────────────────────────────────── */
.pane{ position:absolute; top:0; bottom:0; }
/* ★ 십자키 그림은 안내일 뿐. 왼쪽 판 전체가 조작 영역입니다. */
#padArea{ position:absolute; inset:0; touch-action:none; }
#padHint{ position:absolute; opacity:.5; pointer-events:none; }
#padHint path{ fill:none; stroke:var(--dim); stroke-width:3; }
.lbl{ position:absolute; font-size:9px; letter-spacing:1.5px; color:var(--dim);
      pointer-events:none; }

/* ★ 높이를 버튼 바로 위까지로 잘라둡니다.
     글자를 아주 크게 하면 안내글이 길어져 MENU 버튼을 덮습니다.
     실제 크기는 fit() 이 정합니다. */
#info{ position:absolute; overflow:hidden; font-size:calc(var(--fs) * .78); line-height:1.55; letter-spacing:.6px; }
#info .h{ color:var(--or); font-size:calc(var(--fs) * .78); letter-spacing:2px; }
#info .v{ color:var(--dim); }
#info hr{ border:0; border-top:1px solid var(--dim); margin:2px 0 5px; }

/* ── 버튼은 전부 고정 크기 (손가락 크기라 글자와 무관) ──────────────
   NES 패드 배치를 따릅니다:
     십자키 왼쪽 · SELECT/START 작은 알약 두 개 · B A 동그라미 (B 가 왼쪽) */
.btn{ position:absolute; border:3px solid var(--dim); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; color:var(--dim); }
/* ★★ 보이는 것보다 **누를 수 있는 면이 더 넓습니다.** ★★
     테두리 바깥으로 10px 씩 더 잡습니다. 게임 중에 화면을 안 보고
     엄지로 더듬어 누르기 때문에, 빗나가도 눌리는 게 맞습니다.
     (보이는 동그라미는 그대로라 화면은 안 지저분해집니다.) */
.btn::before, .cap::before{ content:""; position:absolute; inset:-10px; }
.btn.on{ border-color:var(--or); color:var(--or); background:rgba(248,134,30,.18); }
/* SELECT / START — 눕힌 알약 */
.cap{ position:absolute; border:2px solid var(--dim); border-radius:99px;
      display:flex; align-items:center; justify-content:center;
      font-size:8px; letter-spacing:.5px; color:var(--dim); }
.cap.on{ border-color:var(--or); color:var(--or); background:rgba(248,134,30,.18); }
/* 알약 위에 붙는 이름표 (NES 처럼) */
.caplbl{ position:absolute; font-size:7px; letter-spacing:1px; color:var(--dim);
         text-align:center; pointer-events:none; }
/* 탈출구는 항상 밝게. 흐리면 못 찾습니다. */
.cap.up{ border-color:var(--or); color:var(--or); font-size:10px;
         letter-spacing:1.5px; border-radius:8px; }
.cap.up.on{ background:var(--or); color:var(--bg); }
/* 글자 크기 조절 (왼쪽 판 위) */
.fsbtn{ position:absolute; border:2px solid var(--dim); border-radius:6px;
        display:flex; align-items:center; justify-content:center;
        font-size:12px; color:var(--dim); }
.fsbtn.on{ border-color:var(--or); color:var(--or); }

#bar{ position:absolute; left:8px; right:8px; bottom:3px; display:flex;
      justify-content:space-between; font-size:9px; letter-spacing:1px;
      color:var(--dim); pointer-events:none; }
/* 왼쪽 글자만 눌러서 템패드로 돌아갑니다 */
/* 나가는 길은 눈에 보여야 합니다. 테두리를 둘러 버튼처럼. */
#back{ pointer-events:auto; padding:2px 7px; margin:-2px -1px;
       border:1px solid var(--dim); border-radius:5px; color:var(--or); }
#note{ position:absolute; left:8px; right:8px; bottom:15px; font-size:calc(var(--fs) * .7);
       letter-spacing:1px; color:var(--or); text-align:center; pointer-events:none; }

#rot{ position:fixed; inset:0; display:none; background:var(--bg);
      align-items:center; justify-content:center; font-size:14px; letter-spacing:2px; z-index:99; }
@media (orientation:portrait){ #rot{ display:flex; } #dev{ visibility:hidden; } }
#file,#dir{ display:none; }
</style>
</head>
<body>

<div id="dev">
  <div class="pane" id="paneL">
    <div id="padArea"></div>
    <svg id="padHint" viewBox="0 0 100 100">
      <path d="M35 12 H65 V35 H88 V65 H65 V88 H35 V65 H12 V35 H35 Z"/>
    </svg>
    <div class="lbl" id="lblMove">MOVE</div>
    <!-- 읽는 글자만 키웁니다. 버튼·십자키는 그대로입니다. -->
    <div class="fsbtn" id="fsUp">A+</div>
    <div class="fsbtn" id="fsDn">A-</div>
  </div>

  <div id="stage">
    <canvas id="screen" width="160" height="144"></canvas>
    <div id="page"></div>
  </div>

  <div class="pane" id="paneR">
    <div id="info"></div>
    <!-- ★ 항상 "한 단계 위로" 가는 버튼. 게임 중에는 유일한 탈출구입니다.
         게임보이 버튼 8개는 전부 게임이 가져가기 때문입니다. -->
    <div class="cap up" id="btnUp">MENU</div>
    <div class="caplbl" id="lblSel">SELECT</div>
    <div class="caplbl" id="lblSta">START</div>
    <div class="cap" id="btnSel"></div>
    <div class="cap" id="btnSta"></div>
    <div class="btn" id="btnB">B</div>
    <div class="btn" id="btnA">A</div>
  </div>

  <div id="note"></div>
  <!-- ★ 예전에는 이 글자가 "누르면 나가기" 였습니다.
       그런데 **십자키 바로 옆**이라 게임 중에 엄지가 스치면 그대로
       밖으로 튕겨나갔습니다. 이제 그냥 이름표입니다. 아무 일도 안 합니다.
       나가는 길은 기기 고르는 화면의 MENU → EXIT 하나뿐입니다. -->
  <div id="bar"><span id="back">TVA // FIELD UNIT</span><span id="diag">—</span></div>
</div>

<div id="rot">TURN THE DEVICE SIDEWAYS</div>
<!-- 파일 하나 또는 여러 개 -->
<input type="file" id="file" accept=".gb,.gbc" multiple>
<!-- ★ 폴더째. webkitdirectory 는 표준은 아니지만 안드로이드·PC 에서 됩니다.
     아이폰 사파리는 속성만 있고 실제로는 안 돼서, 아래 CAN_DIR 로 가려냅니다. -->
<input type="file" id="dir" webkitdirectory directory multiple>

<!-- ★ binjgb 를 먼저 불러야 합니다. 아래에 두면 boot() 이 먼저 돌아서 못 찾습니다.
     파일이 없어도 페이지는 떠야 하므로 onerror 로 넘어갑니다. -->
<script src="binjgb.js" onerror="window.__noBinjgb=1"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script src="pad.js"></script>
<script>
/* ── 새 상태값은 맨 위에 ───────────────────────────────────────────── */
let scale     = 2;      /* 게임 화면 확대율 (정수) */
let edgeRight = 0;      /* 폰마다 오른쪽이 잘려서 따로 조절 */
let wasmMod   = null;   /* binjgb. 처음 필요할 때 부릅니다 */
let ui        = null;
let pad       = null;
/* ★★ 화면 깜빡임 방지 ★★
   폰에서 visualViewport 의 scroll 은 쉴 새 없이 옵니다.
   그때마다 화면 전체를 다시 재면 번쩍번쩍 깜빡입니다.
     1. 한 프레임에 한 번만
     2. 크기가 그대로면 아무것도 안 함
     3. 노치 여백은 한 번만 재서 기억 (매번 DOM 을 만들었다 지우면 느립니다) */
let fitPending  = false;
let lastFitKey  = "";
let insCache    = null;

const GW = 160, GH = 144, MARGIN = 12, MIN_PANE = 150;
const $ = id => document.getElementById(id);

/* ★★ 화면에 글자를 넣기 전에 반드시 이걸 거칩니다. ★★
     게임 이름은 롬 안에서 읽거나 **파일 이름에서 가져옵니다.**
     파일 이름은 아드님이 마음대로 지을 수 있습니다.
     `<img onerror=...>.gb` 같은 이름이면 그게 그대로 실행됩니다.
     장난감이라도 이건 막아둡니다. */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ★ 폴더째 고르기가 되는 기기인지.
     아이폰·아이패드 사파리는 webkitdirectory 속성은 있는데 실제로는
     폴더를 못 고릅니다. 그래서 속성 검사만으로는 안 되고 기기를 봅니다.
     (아이패드는 최근 것부터 "Macintosh" 라고 말해서 손가락 수까지 봅니다.) */
/* ★ 지우기 확인창이 뜬 시각. 뜬 직후 잠깐은 버튼을 안 받습니다.
     길게 누르던 손가락을 떼면서 다른 버튼이 같이 눌리는 사고를 막습니다. */
let armAt = 0;
const ARM_MS = 400;
/* boot() 안에서 만드는 "길게 누르기 취소" 함수를 여기에 걸어둡니다.
   draw() 가 화면을 새로 그릴 때 같이 꺼야 하기 때문입니다. */
let holdCancel = null;
/* boot() 안에서 만드는 "정리하고 템패드로 나가기". EXIT 가 씁니다. */
let doLeave = null;

/* ── 블루투스 게임패드 상태 ───────────────────────────────────────────
   ★ 일부러 여기(맨 바깥)에 둡니다. boot() 안에 두면 검사에서 들여다볼 수가
     없어서, "돌고 있는지" 를 확인할 방법이 사라집니다. */
let gpPrev = [];      /* 지난 프레임에 눌려 있던 것들 */
let gpRaf  = 0;       /* 프레임 예약 번호. 0 이면 안 돌고 있음 */
let gpSeen = false;   /* 첫 입력을 봤는가 (소리 깨우기용) */

const CAN_DIR = (() => {
  try {
    if (!("webkitdirectory" in document.createElement("input"))) return false;
    const ua = navigator.userAgent || "";
    const iOS = /iPad|iPhone|iPod/.test(ua) ||
                (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
    return !iOS;
  } catch (e) { return false; }
})();

/* ══ 크기 맞추기 ══════════════════════════════════════════════════════
   ★ vh/vw 를 믿지 마세요. 폰마다 주소창을 포함해서 알려줍니다.
     visualViewport 가 실제로 보이는 크기입니다.                        */
function insets(){
  if (insCache) return insCache;          /* ★ 한 번만 잽니다 */
  const p = document.createElement("div");
  p.style.cssText = "position:fixed;visibility:hidden;"
    + "top:env(safe-area-inset-top);left:env(safe-area-inset-left);"
    + "bottom:env(safe-area-inset-bottom);right:env(safe-area-inset-right)";
  document.body.appendChild(p);
  const s = getComputedStyle(p), n = v => Math.max(0, parseFloat(v) || 0);
  const r = { t:n(s.top), l:n(s.left), b:n(s.bottom), r:n(s.right) };
  p.remove();
  insCache = r;
  return r;
}

function scheduleFit(){
  if (fitPending) return;
  fitPending = true;
  requestAnimationFrame(() => { fitPending = false; fit(); });
}

function fit(){
  const vv = window.visualViewport, de = document.documentElement;
  const small = (a,b,c) => Math.floor(Math.min(a||Infinity, b||Infinity, c||Infinity));
  const W = small(vv && vv.width,  de && de.clientWidth,  window.innerWidth);
  const H = small(vv && vv.height, de && de.clientHeight, window.innerHeight);
  if(!isFinite(W) || !isFinite(H) || !W || !H) return;

  const ins = insets();
  /* ★ 지난번과 똑같으면 아무것도 안 합니다. 이게 깜빡임을 없앱니다. */
  const key = `${W}x${H}|${ins.t},${ins.r},${ins.b},${ins.l}|${edgeRight}|${fsNow}`;
  if (key === lastFitKey) return;
  lastFitKey = key;

  const dw = W - ins.l - ins.r - MARGIN*2 - edgeRight;
  const dh = H - ins.t - ins.b - MARGIN*2;
  const dev = $("dev");
  dev.style.left = (ins.l+MARGIN)+"px"; dev.style.top = (ins.t+MARGIN)+"px";
  dev.style.width = dw+"px"; dev.style.height = dh+"px";

  /* ★ 정수배만. 소수배로 늘리면 도트가 뭉개집니다. */
  scale = 1;
  for(let s = 12; s >= 1; s--){
    if(GH*s <= dh-8 && GW*s <= dw-MIN_PANE*2){ scale = s; break; }
  }
  const gw = GW*scale, gh = GH*scale;
  const gx = Math.round((dw-gw)/2), gy = Math.round((dh-gh)/2);

  const st = $("stage");
  st.style.left=(gx-2)+"px"; st.style.top=(gy-2)+"px";
  st.style.width=(gw+4)+"px"; st.style.height=(gh+4)+"px";
  $("screen").style.width=gw+"px"; $("screen").style.height=gh+"px";
  const pg = $("page");
  pg.style.left="0px"; pg.style.top="0px"; pg.style.width=gw+"px"; pg.style.height=gh+"px";

  $("paneL").style.left="0px";        $("paneL").style.width=gx+"px";
  $("paneR").style.left=(gx+gw)+"px"; $("paneR").style.width=(dw-gx-gw)+"px";

  /* ── 버튼 자리 ────────────────────────────────────────────────────
     NES 패드처럼 **십자키와 A·B 를 같은 높이**에 둡니다.
     SELECT·START 는 A·B 에서 넉넉히 띄웁니다 — 가까우면 게임 중에
     엄지가 스치면서 눌립니다.
     크기는 전부 고정입니다 (손가락 크기라 글자와 무관).             */
  const rw   = dw - gx - gw;
  /* ★ 46 → 58. 46px 는 손가락 최소 권장치(약 44)에 겨우 걸쳐서,
       게임 중에 자꾸 빗나갔습니다. 실제 누르는 면은 아래 CSS 로
       테두리 바깥까지 더 넓힙니다(보이는 것보다 큰 과녁). */
  const bs   = 58;          /* 동그란 버튼 지름 */
  const gapB = 16;          /* B 와 A 사이 */
  const pillW = 48, pillH = 18;
  const GAP_PILL_BTN = 34;  /* ★ SELECT·START 와 A·B 사이. 넉넉히. */

  /* ★ A·B 중심 높이 — 십자키도 여기에 맞춥니다.
       버튼을 맨 아래에 붙이면 십자키가 들어갈 자리가 없어 쪼그라듭니다.
       십자키가 제 크기로 들어갈 만큼만 올립니다.                     */
  const PAD_TARGET = 110;
  const ctrY = dh - Math.max(26 + bs/2, PAD_TARGET/2 + 26);   /* 하단 막대와 안 겹치게 */

  const bx = Math.round((rw - (bs*2+gapB)) / 2);
  const byTop = Math.round(ctrY - bs/2);
  $("btnB").style.cssText += `;left:${bx}px;top:${byTop}px;width:${bs}px;height:${bs}px;`;
  $("btnA").style.cssText += `;left:${bx+bs+gapB}px;top:${byTop}px;width:${bs}px;height:${bs}px;`;

  /* SELECT·START 알약 + 이름표 */
  const px = Math.round((rw - (pillW*2+gapB)) / 2);
  const py = byTop - GAP_PILL_BTN - pillH;
  $("btnSel").style.cssText += `;left:${px}px;top:${py}px;width:${pillW}px;height:${pillH}px;`;
  $("btnSta").style.cssText += `;left:${px+pillW+gapB}px;top:${py}px;width:${pillW}px;height:${pillH}px;`;
  $("lblSel").style.cssText += `;left:${px}px;top:${py-11}px;width:${pillW}px;`;
  $("lblSta").style.cssText += `;left:${px+pillW+gapB}px;top:${py-11}px;width:${pillW}px;`;

  /* 탈출구는 그 위에 */
  const uw  = pillW*2+gapB;
  const upY = py - 11 - 10 - 26;
  $("btnUp").style.cssText += `;left:${px}px;top:${upY}px;width:${uw}px;height:26px;`;

  /* 안내글은 MENU 버튼 위까지만 (글자를 키워도 버튼을 안 덮게) */
  $("info").style.left = "12px";
  $("info").style.top  = (gy+2) + "px";
  $("info").style.width  = (rw-20) + "px";
  $("info").style.height = Math.max(30, upY - (gy+2) - 8) + "px";

  /* ── 왼쪽 판 ───────────────────────────────────────────────────────
     ★ 십자키 중심을 A·B 와 같은 높이에 맞춥니다.
       위아래로 삐져나가지 않게 크기를 줄여서 맞춥니다.              */
  const fw = 30, fh = 24, fgap = 8, fTop = 10;
  const roomUp   = ctrY - (fTop + fh + 14);      /* 글자크기 버튼 아래까지 */
  const roomDown = dh - ctrY - 22;               /* 아래 여백 (하단 막대 자리) */
  let ps = Math.min(PAD_TARGET, gx - 26, roomUp * 2, roomDown * 2);
  ps = Math.max(56, Math.floor(ps));
  const ph = $("padHint");
  ph.style.width = ps + "px"; ph.style.height = ps + "px";
  ph.style.left = Math.round((gx - ps) / 2) + "px";
  ph.style.top  = Math.round(ctrY - ps/2) + "px";
  /* ★ 글자는 십자키 위에. 아래에 두면 화면 맨 아래 막대와 겹칩니다. */
  $("lblMove").style.left = Math.round((gx - 32) / 2) + "px";
  $("lblMove").style.top  = Math.round(ctrY - ps/2 - 13) + "px";

  const fx = Math.round((gx - (fw*2+fgap)) / 2);
  $("fsDn").style.cssText += `;left:${fx}px;top:${fTop}px;width:${fw}px;height:${fh}px;`;
  $("fsUp").style.cssText += `;left:${fx+fw+fgap}px;top:${fTop}px;width:${fw}px;height:${fh}px;`;

  $("diag").textContent = `${W}x${H} x${scale}`;
}

/* ══ 그리기 ═══════════════════════════════════════════════════════════ */
function draw(){
  /* ★ 줄을 새로 그리면 "누르고 있음" 표시가 사라집니다.
       그런데 시계는 살아 있어서, 아무 표시 없이 지우기 창이 튀어나옵니다.
       (글자 크기 버튼 하나만 눌러도 이 일이 벌어졌습니다.) */
  if (holdCancel) holdCancel();
  const st = ui.state, pg = $("page"), inf = $("info"), sc = $("screen");
  const playing = st.screen === "play";
  sc.style.visibility = playing ? "visible" : "hidden";
  pg.style.display = playing ? "none" : "block";
  $("note").textContent = st.notice || "";
  /* ★ 어디로 가는지 글자로. 갈 곳이 없으면 흐리게 해서 눌러도 소용없음을 보입니다. */
  const upTxt = ui.upLabel();
  $("btnUp").textContent = upTxt;
  $("btnUp").style.opacity = (upTxt === "\u2014") ? ".3" : "1";

  if (st.screen === "system"){
    pg.innerHTML = "<h2>SELECT SYSTEM</h2>" + GameUi.SYSTEMS.map((s,i) =>
      `<div class="row ${i===st.cursor?"sel":""}">${s.name}<div class="sub">${s.desc}</div></div>`
    ).join("");
    inf.innerHTML = `<div class="h">FIELD UNIT</div><hr>
      <div class="v">
        &#9650;&#9660; &nbsp;MOVE<br>
        A &nbsp;&nbsp;&nbsp;&nbsp;SELECT<br>
        MENU &nbsp;EXIT
      </div><br>
      <div class="v">TO LEAVE,<br>PRESS MENU</div>`;
  }
  else if (st.screen === "top"){
    /* ★ 나가는 길. 커서는 항상 BACK 에서 시작합니다.
         잘못 눌러도 밖으로 안 나가게, 위험한 쪽을 아래에 둡니다. */
    pg.innerHTML = `<h2>FIELD UNIT</h2>` +
      ui.topItems().map((m,i) =>
        `<div class="row one ${i===st.cursor?"sel":""}">${m.label}<span class="sub">${m.sub}</span></div>`
      ).join("");
    inf.innerHTML = `<div class="h">MENU</div><hr>
      <div class="v">
        &#9650;&#9660; &nbsp;MOVE<br>
        A &nbsp;&nbsp;&nbsp;&nbsp;CHOOSE<br>
        MENU &nbsp;BACK
      </div><br>
      <div class="v">EXIT RETURNS<br>TO THE TEMPAD</div>`;
  }
  else if (st.screen === "list" && st.confirm){
    /* ★ 지우기는 되돌릴 수 없습니다 (세이브까지 같이 사라집니다).
         그래서 목록을 감추고 이 화면만 보여줍니다.
         목록이 보이면 "어느 것을 지우는지" 헷갈립니다. */
    pg.innerHTML = `<h2>DELETE GAME?</h2>
      <div class="ask">
        <b>${esc(st.confirm.title)}</b>
        <span class="warn">THIS ALSO DELETES<br>ITS SAVES. FOREVER.<br><br>
        PRESS START TO DELETE.<br>ANY OTHER BUTTON KEEPS IT.</span>
      </div>`;
    /* ★ 안전한 쪽(KEEP)을 맨 위에. 위험한 쪽은 맨 아래에.
         그리고 지우는 건 A 가 아니라 START 입니다 — 위 onPress 참고. */
    inf.innerHTML = `<div class="h">DELETE?</div><hr>
      <div class="v">
        A &nbsp;&nbsp;&nbsp;&nbsp;KEEP IT<br>
        B &nbsp;&nbsp;&nbsp;&nbsp;KEEP IT<br>
        MENU &nbsp;KEEP IT<br>
        <br>
        START DELETE
      </div>`;
  }
  else if (st.screen === "list"){
    const list = ui.list();
    const canAdd = st.systemId === "gb";
    pg.innerHTML = "<h2>" + esc(ui.systemName()) + "</h2>" + (list.length
      ? list.map((r,i) =>
          /* data-i 로 몇 번째 줄인지 붙여둡니다. 길게 누르기가 이걸 봅니다. */
          `<div class="row ${i===st.cursor?"sel":""}" data-i="${i}">${esc(r.title)}<div class="sub">${
            esc((r.hasSram?"SAVE ":"") + (r.states.some(Boolean)?"STATE ":"") + (r.note||""))
          }</div><div class="hold"></div></div>`
        ).join("")
      : (canAdd
          ? `<div class="empty">NO GAMES YET.<br><br>PRESS START TO ADD FILES.</div>`
          : `<div class="empty">NOTHING HERE YET.</div>`));
    /* ★ 파일을 받는 건 게임보이 목록뿐입니다.
         게임&워치 목록은 저장소를 안 봐서, 거기서 받으면 "넣었다"고 해놓고
         화면에는 아무것도 안 나옵니다. 그래서 안내조차 안 보여줍니다. */
    inf.innerHTML = `<div class="h">${list.length} GAME${list.length===1?"":"S"}</div><hr>
      <div class="v">
        &#9650;&#9660; &nbsp;MOVE<br>
        A &nbsp;&nbsp;&nbsp;&nbsp;PLAY<br>` + (canAdd ? `
        START ADD FILE<br>
        SEL &nbsp;&nbsp;LIBRARY<br>` : ``) + `
        MENU &nbsp;SYSTEM
      </div>` + (canAdd ? `<br>
      <div class="v">LIBRARY HAS<br>ADD &amp; REMOVE</div>` : ``);
  }
  else if (st.screen === "library"){
    /* 넣기·폴더넣기·지우기를 한자리에. 버튼 넷으로는 다 못 걸어서입니다. */
    const items = ui.libraryItems(CAN_DIR);
    pg.innerHTML = `<h2>LIBRARY</h2>` + items.map((m,i) =>
      `<div class="row one ${i===st.cursor?"sel":""}">${m.label}<span class="sub">${esc(m.sub)}</span></div>`
    ).join("");
    /* ★ 아이폰은 진짜 폴더 고르기가 안 되므로, 대신 무엇을 하면 되는지 씁니다 */
    const folderNote = CAN_DIR
      ? `<div class="v">ADD FOLDER TAKES<br>EVERY GAME INSIDE</div>`
      : `<div class="v">THIS PHONE CANNOT<br>PICK A FOLDER.<br>
           OPEN IT AND SELECT<br>ALL THE FILES.</div>`;
    inf.innerHTML = `<div class="h">LIBRARY</div><hr>
      <div class="v">
        &#9650;&#9660; &nbsp;MOVE<br>
        A &nbsp;&nbsp;&nbsp;&nbsp;CHOOSE<br>
        MENU &nbsp;BACK
      </div><br>` + folderNote;
  }
  else if (st.screen === "menu"){
    pg.innerHTML = `<h2>PAUSED</h2>` +
      ui.menuItems().map((m,i) =>
        `<div class="row one ${i===st.cursor?"sel":""}">${m.label}<span class="sub">${m.sub}</span></div>`
      ).join("");
    inf.innerHTML = `<div class="h">${esc(st.title)}</div><hr>
      <div class="v">
        &#9650;&#9660; &nbsp;MOVE<br>
        A &nbsp;&nbsp;&nbsp;&nbsp;CHOOSE<br>
        START SAVE SLOT<br>
        MENU &nbsp;RESUME
      </div>`;
  }
  else {
    inf.innerHTML = `<div class="h">${esc(st.title)}</div><hr>
      <div class="v">PLAYING</div><br>
      <div class="v">MENU BUTTON<br>&nbsp;&nbsp;SAVE / QUIT</div>`;
  }

  /* ★ 고른 줄이 화면 밖으로 나가지 않게 따라갑니다.
       목록이 길어지면 커서만 아래로 가고 화면은 그대로여서
       "아무 반응이 없다"고 느끼게 됩니다.                              */
  const selEl = pg.querySelector(".row.sel");
  if (selEl && selEl.scrollIntoView) selEl.scrollIntoView({ block:"nearest" });
}

/* 라이브러리에서 고른 결과를 처리합니다.
   ★ 폴더 고르기가 안 되는 기기(아이폰)에서는 파일 여러 개 고르기가 열립니다.
     항목 자체는 없애지 않습니다 — 없으면 "내 폰엔 왜 없지" 가 됩니다. */
function openLib(what){
  if (what === "file")   $("file").click();
  if (what === "folder") $(CAN_DIR ? "dir" : "file").click();
}

/* ══ 조작 ═════════════════════════════════════════════════════════════ */
function onPress(name, down){
  /* 게임 중에는 여덟 버튼을 전부 게임에 넘깁니다.
     나가는 길은 MENU 버튼 하나뿐입니다. */
  if (ui.state.screen === "play"){ ui.press(name, down); return; }

  if (!down) return;                      /* 목록에서는 누를 때만 반응 */
  const st = ui.state;
  if (name === "up")   { ui.move(-1); draw(); return; }
  if (name === "down") { ui.move(1);  draw(); return; }

  if (st.screen === "system"){
    /* ★ B 로는 안 나갑니다. 나가는 길은 MENU 버튼 → EXIT 하나뿐입니다. */
    if (name === "A") ui.pickSystem(GameUi.SYSTEMS[st.cursor].id).then(draw);
    return;
  }
  if (st.screen === "top"){
    /* ★ A 로 고르기만. B 로는 나갈 수 없습니다 —
         나가려면 EXIT 를 눈으로 보고 고르게 합니다. */
    if (name === "A")      { ui.chooseTop(); draw(); }
    else if (name === "B") { ui.closeTop(); draw(); }
    return;
  }
  if (st.screen === "list"){
    /* ★ 지울까 물어보는 중에는 버튼 뜻이 완전히 달라집니다.
         A = 지운다, 나머지 전부 = 안 지운다.
         "안 지운다" 쪽을 넓게 잡아둡니다 — 잘못 눌러서 지워지는 것보다
         잘못 눌러서 안 지워지는 편이 백 배 낫습니다. */
    /* ★★ 지우는 버튼은 A 가 아니라 START 입니다. ★★

       목록에서 A 는 늘 "게임 시작" 이었습니다. 그 손버릇 그대로
       확인창에서 A 를 누르면 게임이 사라집니다. 되돌릴 수 없습니다.
       그래서 **평소에 안 쓰던 버튼**으로 옮겼습니다.
       A·B·SELECT·MENU 는 전부 "안 지움" 입니다. 안전한 쪽을 넓게. */
    if (st.confirm){
      /* ★ 창이 뜬 직후 잠깐은 아무것도 안 받습니다.
           길게 누르던 손가락을 떼면서 다른 버튼이 같이 눌리는 걸 막습니다. */
      if (Date.now() - armAt < ARM_MS) return;
      if (name === "start") ui.confirmRemove().then(draw);
      else                  { ui.cancelRemove(); draw(); }
      return;
    }
    if (name === "A")           ui.play().then(draw);
    else if (name === "B")      { ui.backToSystem(); draw(); }
    /* ★ 파일 받기는 게임보이 목록에서만. 게임&워치는 저장소를 안 봅니다. */
    else if (st.systemId !== "gb") { /* 아무 일도 안 함 */ }
    else if (name === "start")  $("file").click();       /* 지름길 */
    else if (name === "select") { ui.openLibrary(); draw(); }
    return;
  }
  if (st.screen === "library"){
    if (name === "A")           { openLib(ui.chooseLibrary()); draw(); }
    else if (name === "B")      { ui.closeLibrary(); draw(); }
    return;
  }
  if (st.screen === "menu"){
    if (name === "A")           ui.chooseMenu().then(draw);
    else if (name === "start")  ui.saveMenu().then(draw);   /* 칸에 저장 */
    else if (name === "B")      { ui.closeMenu(); draw(); }
    return;
  }
}

/* ══ 시작 ═════════════════════════════════════════════════════════════ */
async function loadWasm(){
  if (wasmMod) return wasmMod;
  if (typeof Binjgb !== "function") throw new Error("no-binjgb");
  wasmMod = await Binjgb();
  return wasmMod;
}

async function fetchRom(path){
  const res = await fetch(path);
  if (!res.ok) throw new Error("rom-missing");
  return new Uint8Array(await res.arrayBuffer());
}

/* ══ 글자 크기 ═══════════════════════════════════════════════════════
   ★ 읽는 글자만 바꿉니다. 버튼과 십자키는 고정입니다.
     템패드 본체와 같은 이름표를 써서 설정이 이어집니다.              */
const FS_KEY = "tempad.fs", FS_MIN = 9, FS_MAX = 26, FS_STEP = 1;
let fsNow = 13;

function applyFS(v){
  fsNow = Math.max(FS_MIN, Math.min(FS_MAX, Math.round(v)));
  document.documentElement.style.setProperty("--fs", fsNow + "px");
  try{ localStorage.setItem(FS_KEY, String(fsNow)); }catch(e){}
  $("fsDn").style.opacity = fsNow <= FS_MIN ? ".35" : "1";
  $("fsUp").style.opacity = fsNow >= FS_MAX ? ".35" : "1";
  lastFitKey = "";                      /* 글자가 바뀌면 다시 재야 합니다 */
  scheduleFit();
  if(ui) draw();                        /* 줄 높이가 바뀌니 다시 그립니다 */
}

function initFS(){
  let v = 0;
  try{ v = Number(localStorage.getItem(FS_KEY)); }catch(e){}
  if(!isFinite(v) || v < FS_MIN || v > FS_MAX){
    /* 저장된 게 없으면 손가락으로 쓰는 기기는 조금 크게 */
    v = matchMedia("(pointer:coarse)").matches ? 16 : 13;
  }
  applyFS(v);
}

function boot(){
  ui = new GameUi.Ui({
    store: GameMode.RomStore,
    engine: GameMode,
    readFile: GameMode.readFile,
    looksLikeGb: GameMode.looksLikeGb,
    fetchRom, loadWasm,
    canvas: $("screen"),
    /* ★ 나가기 전에 십자키를 놓고 에뮬레이터를 정리해야 합니다.
         전에는 여기서 곧장 주소만 바꿔서, 눌린 키와 돌던 게임이
         그대로 남은 채 페이지를 떠났습니다. */
    onExit: () => { if (doLeave) doLeave();
                    else { try { location.replace("../"); } catch (e) { location.href = "../"; } } },
  });

  /* ★ 게임이 뜻하지 않게 사라지면(브라우저가 얼리거나 떠날 때) 화면도 따라 나옵니다.
       안 그러면 "PLAYING" 이라고 적힌 멈춘 화면에 갇힙니다. */
  GameMode.setOnGone(() => {
    if (ui.state.screen === "play" || ui.state.screen === "menu") {
      ui.quit().then(() => { ui.warn("GAME STOPPED"); draw(); });
    }
  });

  /* ★ 아이폰 소리 대책 — 손가락이 처음 닿는 순간에 소리 장치를 깨웁니다.
       게임 시작 시점은 이미 늦습니다 (기다린 뒤라 제스처가 끊깁니다). */
  document.addEventListener("pointerdown", () => GameMode.wakeAudio(), { capture:true });

  pad = new GamePad4.Pad({ onPress });
  pad.attach($("padArea"), [
    [$("btnA"), "A"], [$("btnB"), "B"],
    [$("btnSel"), "select"], [$("btnSta"), "start"],
  ]);

  /* 글자 크기 버튼 */
  const hookFs = (id, delta) => {
    const el = $(id);
    el.addEventListener("pointerdown", e => { e.preventDefault(); el.classList.add("on"); });
    ["pointerup","pointercancel","pointerleave"].forEach(t =>
      el.addEventListener(t, () => el.classList.remove("on")));
    el.addEventListener("click", () => applyFS(fsNow + delta));
  };
  hookFs("fsUp",  FS_STEP);
  hookFs("fsDn", -FS_STEP);
  initFS();

  /* ── 파일 / 폴더 받기 ────────────────────────────────────────────────
     둘 다 같은 곳으로 갑니다. 폴더를 고르면 그 안의 것이 전부 옵니다
     (하위 폴더까지). 거르는 일은 ui.addRoms 가 합니다.               */
  async function takeFiles(input){
    const files = Array.from(input.files || []);
    /* ★ 값을 먼저 비웁니다. 같은 폴더를 두 번 골라도 반응하게. */
    input.value = "";
    if (!files.length) return;

    if (files.length === 1){ await ui.addRom(files[0]); draw(); return; }

    /* 여러 개일 때는 몇 개째인지 보여줍니다. 안 보이면 멈춘 줄 압니다. */
    let last = 0;
    await ui.addRoms(files, (now, total) => {
      /* 너무 자주 그리면 오히려 느려집니다. 한 번에 한 개씩만. */
      if (now === total || now - last >= 1){
        last = now;
        $("note").textContent = `READING ${now} / ${total}`;
      }
    });
    draw();
  }
  $("file").addEventListener("change", e => takeFiles(e.target));
  $("dir") .addEventListener("change", e => takeFiles(e.target));

  /* ── ★ 목록에서 손가락으로 고르기 / 길게 눌러 지우기 ──────────────────
     줄은 그릴 때마다 새로 만들어지므로, 듣는 쪽은 #page 에 한 번만 답니다.

     짧게 누름 → 그 줄로 커서 이동. 이미 고른 줄이면 시작.
     길게 누름 → 지울까 물어봄.

     [ 반드시 챙겨야 하는 것 ]
       · 손가락이 움직이면 취소 (스크롤하려던 것이지 지우려던 게 아님)
       · pointercancel 도 취소 (전화가 오면 옴)
       · 길게 눌러 확인창이 뜬 뒤에는 손을 떼도 아무 일 없어야 함    */
  /* ★ 600ms 는 너무 짧습니다.
       안드로이드가 "길게 누름" 으로 치는 기본값이 500ms, 아이폰도 0.5초입니다.
       즉 600ms 는 **망설이는 탭**과 겨우 100ms 차이입니다.
       줄 하나 고르려고 잠깐 멈칫한 것이 지우기 창을 띄웁니다. */
  const HOLD_MS = 900;

  let holdT = null, holdRow = null, holdI = -1, holdId = null,
      holdX = 0, holdY = 0;

  function cancelHold(){
    if (holdT) { clearTimeout(holdT); holdT = null; }
    if (holdRow) { holdRow.classList.remove("holding"); holdRow = null; }
    holdI = -1; holdId = null;
  }
  /* ★ draw() 가 줄을 통째로 새로 그리면 막대는 사라지는데 시계는 살아남습니다.
       그러면 아무 예고 없이 지우기 창이 튀어나옵니다. 같이 끄게 연결합니다. */
  holdCancel = cancelHold;

  $("page").addEventListener("pointerdown", e => {
    /* ★ 이미 다른 손가락이 누르고 있으면 무시합니다.
         전에는 두 번째 손가락이 첫 번째의 상태를 덮어써서,
         빈 곳을 톡 쳤는데 게임이 켜지는 일이 있었습니다. */
    if (holdId !== null) return;
    const st = ui.state;
    if (st.screen !== "list" || st.confirm) return;
    const row = e.target && e.target.closest && e.target.closest(".row[data-i]");
    if (!row) return;
    holdRow = row; holdI = Number(row.dataset.i); holdId = e.pointerId;
    holdX = e.clientX; holdY = e.clientY;
    /* 막대가 차오르는 걸 보여줍니다 — 얼마나 더 눌러야 하는지 알게 */
    row.classList.add("holding");
    holdT = setTimeout(() => {
      holdT = null;
      const i = holdI;
      cancelHold();
      /* ★ 지울 수 있는 것일 때만 진동합니다.
           기본 게임은 못 지우는데도 부르르 떨면, "떨렸으니 지워지는구나" 를
           잘못 배웁니다. 그 학습이 나중에 확인창을 안 읽게 만듭니다. */
      if (ui.askRemove(i)) {
        armAt = Date.now();
        try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
      }
      draw();
    }, HOLD_MS);
  }, { passive:true });

  $("page").addEventListener("pointermove", e => {
    if (holdId === null || e.pointerId !== holdId) return;
    /* 10px 넘게 움직였으면 스크롤하려는 것입니다 */
    if (Math.abs(e.clientX - holdX) > 10 || Math.abs(e.clientY - holdY) > 10) cancelHold();
  }, { passive:true });

  $("page").addEventListener("pointerup", e => {
    if (holdId === null || e.pointerId !== holdId) return;
    const i = holdI;
    cancelHold();
    if (i < 0) return;                       /* 이미 확인창이 떴으면 끝 */
    const st = ui.state;
    if (st.screen !== "list" || st.confirm) return;
    /* 고른 줄을 또 누르면 시작. 처음 누른 줄이면 고르기만. */
    if (i === st.cursor) { ui.play().then(draw); }
    else if (ui.setCursor(i)) draw();
  }, { passive:true });

  /* ★ 전화·알림, 그리고 **스크롤이 시작될 때** 여기로 옵니다.
       iOS 사파리는 스크롤을 넘기는 순간 pointermove 를 끊고
       pointercancel 만 보냅니다. 위의 10px 판정은 거기서 안 돕니다. */
  for (const t of ["pointercancel", "pointerleave"])
    $("page").addEventListener(t, e => {
      if (holdId !== null && e && e.pointerId !== undefined && e.pointerId !== holdId) return;
      cancelHold();
    }, { passive:true });
  $("page").addEventListener("scroll", () => cancelHold(), { passive:true });

  /* ── 템패드로 돌아가기 ────────────────────────────────────────────────
     ★ 나가기 전에 반드시 에뮬레이터를 정리합니다.
       페이지를 떠나면 어차피 다 사라지지만, 저장이 날아가지 않게
       마지막 저장을 하고 나가야 합니다.                                */
  /* ★ replace 를 씁니다. href 로 오가면 기록이 쌓여서
       본체의 종료 버튼이 창을 못 닫게 됩니다. */
  function leave(){
    try { if (pad) pad.releaseAll(); } catch (e) {}
    try { GameMode.stop(); } catch (e) {}
    try { location.replace("../"); } catch (e) { location.href = "../"; }
  }
  doLeave = leave;

  /* ── ★ 블루투스 게임패드 ────────────────────────────────────────────
     꽂으면 저절로 잡힙니다. 설정할 것 없습니다.
     터치 조작은 그대로 살아 있어서 둘 다 동시에 쓸 수 있습니다.

     ★ 브라우저는 **버튼을 한 번 누르기 전까지** 패드를 안 알려줍니다
       (몰래 기기를 알아내는 걸 막으려고). 그래서 "연결됨" 이 늦게
       뜨는 게 정상입니다. 아무 버튼이나 한 번 누르면 잡힙니다.       */
  function gpStop(){
    if (gpRaf) { cancelAnimationFrame(gpRaf); gpRaf = 0; }
    /* 눌린 채로 남지 않게 전부 놓습니다 */
    for (const n of gpPrev) { if (n !== "menu") onPress(n, false); }
    gpPrev = [];
  }

  function gpTick(){
    gpRaf = requestAnimationFrame(gpTick);
    let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) {}
    const now = GamePad4.gamepadHeld(pads);
    const changes = GamePad4.gamepadEdges(gpPrev, now);
    gpPrev = now;
    if (!changes.length) return;

    /* 첫 입력 때 소리를 깨웁니다 (아이폰은 손짓이 있어야 소리가 납니다) */
    if (!gpSeen) { gpSeen = true; try { GameMode.wakeAudio(); } catch (e) {} }

    for (const [name, down] of changes) {
      /* L·R 은 화면의 MENU 버튼과 같습니다. 누를 때만 반응합니다. */
      if (name === "menu") { if (down) { if (pad) pad.releaseAll(); ui.up().then(draw); } continue; }
      onPress(name, down);
    }
  }

  function gpStart(){ if (!gpRaf) { gpPrev = []; gpTick(); } }

  addEventListener("gamepadconnected", () => {
    $("diag").textContent = "GAMEPAD";
    gpStart();
  });
  addEventListener("gamepaddisconnected", () => {
    let left = 0;
    try { for (const p of (navigator.getGamepads() || [])) if (p) left++; } catch (e) {}
    if (!left) { gpStop(); scheduleFit(); }   /* scheduleFit 이 diag 글자를 되돌립니다 */
  });
  /* 페이지에 들어올 때 이미 꽂혀 있을 수 있습니다 */
  try {
    for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) if (p) { gpStart(); break; }
  } catch (e) {}
  /* 다른 앱으로 가면 멈춥니다 — 안 그러면 배터리를 계속 먹습니다 */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") gpStop();
    else {
      try {
        for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) if (p) { gpStart(); break; }
      } catch (e) {}
    }
  });
  /* ★ $("back") 에는 아무것도 안 붙입니다.
       십자키 옆이라 게임 중에 스쳐 눌리던 자리입니다. 이제 이름표일 뿐입니다. */

  /* ★ 한 단계 위로. 게임 중이면 이게 유일한 탈출구입니다. */
  $("btnUp").addEventListener("pointerdown", e => {
    e.preventDefault();
    $("btnUp").classList.add("on");
    if (pad) pad.releaseAll();            /* 눌린 채 남지 않게 */
  });
  ["pointerup","pointercancel","pointerleave"].forEach(t =>
    $("btnUp").addEventListener(t, () => $("btnUp").classList.remove("on")));
  /* ★ 이 버튼은 페이지를 떠나지 않습니다. 화면 안에서만 한 단계 위로.
       나가는 길은 왼쪽 아래 글자와 일시정지 메뉴의 EXIT 뿐입니다. */
  $("btnUp").addEventListener("click", async () => { await ui.up(); draw(); });

  /* 폰의 뒤로가기로 나갈 때도 정리되게 */
  addEventListener("pagehide", () => {
    try { if (pad) pad.releaseAll(); } catch (e) {}
    try { GameMode.stop(); } catch (e) {}
  });

  /* 다른 앱으로 가면 버튼을 전부 뗍니다.
     안 그러면 돌아왔을 때 눌린 채로 남습니다. */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && pad) pad.releaseAll();
  });
  document.addEventListener("contextmenu", e => e.preventDefault());

  /* binjgb 파일이 없으면 알려줍니다. 검은 화면보다 낫습니다. */
  if (typeof Binjgb !== "function"){
    ui.warn("EMULATOR FILES MISSING — SEE roms/ROMS.md");
  }
  /* ★ 아이폰 사파리는 **7일 안 쓰면 저장한 것을 통째로 지웁니다.**
       (WebKit 공식: 홈 화면에 추가한 앱은 예외)
       그래서 사파리로 그냥 열었을 때만 한 번 알려줍니다. */
  else try {
    const nav = (typeof navigator !== "undefined") ? navigator : null;
    const iOS = !!nav && /iPad|iPhone|iPod/.test(nav.userAgent || "");
    const mm = (typeof matchMedia === "function") ? matchMedia : null;
    const standalone = (nav && nav.standalone === true)
      || (mm && mm("(display-mode: standalone)").matches)
      || (mm && mm("(display-mode: fullscreen)").matches);
    if (iOS && !standalone) ui.warn("ADD TO HOME SCREEN TO KEEP SAVES");
  } catch (e) {}
  draw();
}

addEventListener("resize", scheduleFit);
addEventListener("orientationchange", () => {
  insCache = null;                       /* 돌리면 노치 여백이 바뀝니다 */
  lastFitKey = "";
  setTimeout(scheduleFit, 300);
});
if (window.visualViewport){
  visualViewport.addEventListener("resize", scheduleFit);
  visualViewport.addEventListener("scroll", scheduleFit);
}
boot(); fit(); setTimeout(fit, 200); setTimeout(fit, 700);

/* 오른쪽이 잘리면 START 를 길게 눌러 조절합니다.
   폰마다 화면 크기 보고가 제각각이라 코드로는 못 맞춥니다. */
let holdT = null;
$("btnSta").addEventListener("pointerdown", () => {
  holdT = setTimeout(() => { edgeRight = (edgeRight + 8) % 48; lastFitKey = ""; fit(); }, 900);
});
["pointerup","pointercancel","pointerleave"].forEach(t =>
  $("btnSta").addEventListener(t, () => clearTimeout(holdT)));
</script>
